
<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="light dark" name="color-scheme"/><meta content="#0F172A" name="theme-color"/><meta content="yes" name="apple-mobile-web-app-capable"/><meta content="black-translucent" name="apple-mobile-web-app-status-bar-style"/><meta content="AlignStix" name="apple-mobile-web-app-title"/><link href="./manifest.webmanifest" rel="manifest"/><link href="./icon-180.png" rel="apple-touch-icon"/><link href="./icon-192.png" rel="icon" sizes="192x192" type="image/png"/><link href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%2315171B'/><defs><mask id='m' maskUnits='userSpaceOnUse' x='0' y='0' width='100' height='100'><rect width='100' height='100' fill='%23fff'/><line x1='26' y1='74' x2='74' y2='26' stroke='%23000' stroke-width='27' stroke-linecap='round'/></mask></defs><line x1='26' y1='26' x2='74' y2='74' stroke='%23f6c928' stroke-width='19' stroke-linecap='round' mask='url(%23m)'/><line x1='26' y1='74' x2='74' y2='26' stroke='%23f00600' stroke-width='19' stroke-linecap='round'/></svg>" rel="icon" type="image/svg+xml"/><title>AlignStix – The Logic Stick Puzzle</title><style>
/* AlignStix – Stylesheet (konsolidiert). Akzentfarbe kommt aus Stab 1 via --brand-ui. */
:root{color-scheme:light;--bg:#eef1f6;--panel:#fff;--panel2:#f3f5f9;--line:#d6dce6;--text:#141a26;--muted:#5b6678;--gold:#e0a800;--green:#15803d;--red:#e5384a;
--brand:#e31e24;--brand-ui:#e31e24;--brand-ink:#e31e24;--brand-shadow:#a31217;--brand-soft:rgba(227,30,36,.12);--brand-button-text:#fff;--logo-back:#f6c928;
--ui-shadow:rgba(20,26,38,.14);--viz-bg:#171a21;--viz-line:#2c313b;--viz-text:#c5ccd8;--tier-gold:#d99a00;--tier-silver:#7c8798;--tier-bronze:#b86a2c;
--r-card:22px;--r-btn:14px;--r-node:12px;--ease:cubic-bezier(.2,.8,.2,1)}
html.dark-mode{color-scheme:dark;--bg:#0b1020;--panel:#131b2e;--panel2:#1b2640;--line:#2c3a58;--text:#f2f5fb;--muted:#a3b0c7;--gold:#ffd64a;--green:#4ade80;--red:#ff6878;
--ui-shadow:rgba(0,0,0,.45);--viz-bg:#0d1017;--viz-line:#252b36;--tier-gold:#ffd64a;--tier-silver:#cbd5e1;--tier-bronze:#e09256}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:none;background:var(--bg)}
body{margin:0;min-height:100dvh;overscroll-behavior-y:none;background:radial-gradient(120% 60% at 50% -10%,var(--brand-soft),transparent 60%),var(--bg);color:var(--text);
font-family:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased}
.hidden{display:none!important}
h2,h3,p{margin-top:0}h2{font-size:24px;margin-bottom:0}h3{font-size:18px;margin-bottom:8px}
.muted,.section-note{color:var(--muted)}.section-note{font-size:14px;line-height:1.5}
.app{display:flow-root;max-width:760px;margin:0 auto;padding:0 14px calc(28px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--brand-ui);outline-offset:2px;border-radius:8px}

/* Buttons */
button,select,input{font:inherit;color:inherit}
button{border:1px solid var(--line);border-radius:var(--r-btn);padding:12px 16px;background:var(--panel2);color:var(--text);font-weight:750;cursor:pointer;touch-action:manipulation;
transition:transform .15s var(--ease),background .2s,border-color .2s,box-shadow .2s}
@media (hover:hover) and (pointer:fine){button:hover{border-color:var(--brand-ui)}}button:active{transform:scale(.96)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
button.primary,.story-cta,.solve-btn:not(.solved),.nav-home,.lang-grid button.active,.color-popup-actions .primary{background:var(--brand-ui);border-color:var(--brand-shadow);color:var(--brand-button-text);box-shadow:0 4px 0 var(--brand-shadow)}
button.primary:active,.story-cta:active,.solve-btn:active{box-shadow:0 1px 0 var(--brand-shadow);transform:translateY(3px)}
button.success,.solve-btn.solved{background:var(--green);border-color:var(--green);color:#fff}
html.dark-mode button.success,html.dark-mode .solve-btn.solved{color:#052e16}

/* Header */
.header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:60px;padding:calc(8px + env(safe-area-inset-top)) 0 8px;
background:linear-gradient(var(--bg) 75%,transparent)}
.brand-lockup{cursor:pointer;min-width:0}.tag{font-size:11px;color:var(--muted);letter-spacing:.04em;white-space:nowrap}
.game-nav{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.game-nav button{padding:8px 11px;font-size:14px;border-radius:12px}
.header-stars{display:inline-flex;gap:4px;align-items:center;padding:7px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:14px;font-weight:700}
body.in-game .nav-back,body:not(.in-game) .nav-level{display:none}
body.in-game .nav-home{display:none}

/* Karten & Listen */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);padding:18px;margin:12px 0;box-shadow:0 10px 30px var(--ui-shadow)}
.card .card{box-shadow:none;background:var(--panel2)}
.top,.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid3{grid-template-columns:1fr}}
.list{display:grid;gap:9px}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--panel2)}
.section-head .pill{max-width:55%;font-size:12px;text-align:right}.pill{display:inline-block;padding:4px 10px;border-radius:999px;background:var(--brand-soft);font-size:13px;font-weight:700}
.progress{height:8px;border-radius:99px;overflow:hidden;background:color-mix(in srgb,var(--line) 80%,var(--panel))}
.progress i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,var(--brand-ui),var(--brand-shadow));transition:width .6s var(--ease)}

/* Startseite */
.hero{text-align:center;padding:40px 20px 26px;margin-top:max(4vh,calc(10px + env(safe-area-inset-top)))}
.hero p{color:var(--muted);margin:14px auto 24px;max-width:480px}
.hero-logo{display:flex;flex-direction:column;align-items:center}
.story-cta{width:100%;font-size:18px;padding:16px}
.book-home-btn,.settings-home-btn{width:100%}

/* Logo */
.brand-mark,.logo-word{display:inline-flex;align-items:center;gap:.04em;white-space:nowrap}
.brand-mark{font-size:clamp(15px,4vw,24px)}.logo-word{font-size:clamp(32px,10vw,60px)}
.align-word{font-weight:600;letter-spacing:-.045em}.stix-word{margin-left:.05em;font-weight:1000;letter-spacing:-.055em;-webkit-text-stroke:1.1px currentColor}
.wm-x{display:block;flex:none;width:1.04em;height:1.04em;margin-left:-.14em}
.wm-back,.wm-front{stroke-width:21;stroke-linecap:round;fill:none}.wm-back{stroke:var(--logo-back)}.wm-front{stroke:var(--brand-ink)}
.logo-tagline{font-size:clamp(10px,2vw,12px);letter-spacing:.2em;font-weight:800;color:var(--muted);margin-top:12px}

/* Story-Karte */
.story-chapter{margin-bottom:18px}
.story-chapter-head{display:flex;align-items:baseline;justify-content:space-between;margin:4px 2px 10px}
.difficulty-title{font-size:17px}.story-chapter-head small{color:var(--muted)}
.story-node-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:8px}
.story-node{position:relative;min-height:60px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:var(--r-node);background:var(--panel2)}
.story-node .num{font-weight:900;font-size:16px}.story-node .mini-stars{font-size:11px;letter-spacing:1px}.story-node .mini-stars:empty{display:none}
.story-node.done{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--panel2))}
.story-node.locked{cursor:not-allowed;color:var(--muted);background:var(--panel2)}.story-node.locked>*{opacity:.55}
.story-node.current,.story-level.current{box-shadow:0 0 0 3px var(--brand-ui)}
.story-hurdle{display:flex;flex-direction:column;gap:2px;padding:10px 14px;margin:2px 0 12px;border-radius:var(--r-btn);border:1px dashed var(--line);background:var(--panel2)}
.story-hurdle small{color:var(--muted)}.story-hurdle.chapter{border-style:solid}
.story-summary{margin-bottom:12px;padding:12px 14px;border-radius:var(--r-btn);background:var(--panel2);border:1px solid var(--line)}
.story-levels{display:grid;gap:8px}.story-level{text-align:left}
.tier-3{color:var(--tier-gold)}.tier-2{color:var(--tier-silver)}.tier-1{color:var(--tier-bronze)}

/* Spiel */
.game-header{align-items:flex-start}.game-title-wrap{display:flex;flex-direction:column;gap:2px}.game-head-stars{font-size:13px;color:var(--muted)}
.game-head-actions{display:flex;gap:6px}.bookmark{padding:8px 11px;font-size:18px;line-height:1}.bookmark.active{background:var(--brand-soft);border-color:var(--brand-ui)}
.board-wrap{width:100%;max-width:640px;aspect-ratio:1;margin:12px auto;padding:8px;border-radius:26px;background:var(--viz-bg);border:1px solid var(--viz-line);box-shadow:inset 0 4px 18px rgba(0,0,0,.45),0 8px 24px var(--ui-shadow)}
.board{width:100%;height:100%;display:block;overflow:visible}
.board-bg{fill:#15171b;stroke:#22262c;stroke-width:3}.grid-line{stroke:#687079;stroke-width:2}
.rod-number{font-size:25px;font-weight:1000;dominant-baseline:auto;text-anchor:middle;paint-order:fill;stroke:none}
.board.enter .svg-v-rod,.board.enter .svg-h-rod{animation:drop .5s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
.message{min-height:24px;margin:10px 0 2px;text-align:center;font-weight:700}.message.good{color:var(--green)}.message.bad{color:var(--red)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.solve-btn{grid-column:1/-1;order:-1;font-size:17px;padding:15px}#helpBtn{grid-column:1/-1;order:3}
.actions.book-actions .solve-btn{order:0}
.solve-btn.solved{animation:pop .5s var(--ease)}
.inventory{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.inv{padding:6px 7px 5px;border-radius:var(--r-btn);border:1px solid var(--line);touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:opacity .25s}
.inv-row{display:flex;align-items:center;gap:9px}.inv-name{font-weight:800;font-size:14px}.inv-visual{flex:1;min-width:0}
.inv-status{font-size:11px;line-height:1.2;color:var(--muted)}.inv-free{display:flex;gap:8px;align-items:baseline;opacity:.7}.inv.hinted{outline:2px solid #22c55e}
.inv-stick-wrap,.side-profile-wrap,.rod-side-profile{background:var(--viz-bg);border:1px solid var(--viz-line);border-radius:12px;padding:6px 8px;overflow:hidden}
.inv-stick-wrap{max-width:340px;margin:0 auto;padding:4px 6px;border-radius:9px}.inv-stick-svg,.side-profile,.rod-side-profile svg{display:block;width:100%;height:auto}
.side-profile-wrap{margin-top:12px;padding:12px;border-radius:16px}.rod-side-profile{margin-top:10px}
.inv-symbol,.inv-number-svg{font-size:20px;font-weight:1000;stroke:none}.rod-side-symbol{font-size:24px;font-weight:1000;stroke:none}.rod-side-number{font-size:18px;font-weight:1000;stroke:none}
.side-profile-label{font-size:11px;font-weight:900;fill:#fff}.side-profile-note,.rod-side-note{fill:var(--viz-text);font-size:9px}

/* Anleitung */
.guide-grid{display:grid;gap:12px}.guide-step{padding:16px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--panel2)}
.full-span{grid-column:1/-1}.howto-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}.howto-list li{display:flex;gap:12px;align-items:flex-start}
.howto-num{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;background:var(--brand-ui);color:var(--brand-button-text)}
.guide-link-row,.marker-legend{display:grid;gap:8px;margin-top:12px}.marker-legend-row{display:flex;align-items:center;gap:14px;font-size:14px;font-weight:700}
.marker-example summary{cursor:pointer;font-weight:800;padding:8px 0}.board-bg{rx:22}
.rewards-table{width:100%;border-collapse:collapse}.rewards-table td,.rewards-table th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
.rule{display:flex;gap:10px}.rule-icon{flex:none}

/* Einstellungen & Stäbe */
.set-group h3{margin-bottom:10px}.set-label{font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 6px}
.lang-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.setting-list{display:grid;gap:8px}.setting-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.sr-icon{font-size:20px}.sr-text{flex:1;display:flex;flex-direction:column;min-width:0}.sr-text small{color:var(--muted);font-weight:500}
.setting-row.danger{border-color:var(--red)}
.rod-card{padding:14px;border:1px solid var(--line);border-radius:var(--r-btn);background:var(--panel2)}
.rod-head,.rod-id{display:flex;align-items:center;gap:10px}.rod-head{justify-content:space-between}
.rod-color-button,button.rod-color-button{background:var(--rod-button-color,#cbd5e1)}.rod-color-current{background:var(--rod-current,#cbd5e1)}
.rod-color{width:30px;height:30px;border-radius:10px;border:2px solid var(--line);flex:none}.rod-color-button{padding:0;cursor:pointer}

/* Farbwahl */
.color-popup-card{width:min(560px,100%);max-height:92dvh;overflow:auto}.color-popup-note{text-align:center;color:var(--muted);font-size:12px}
.color-popup-label{font-size:13px;font-weight:800;margin:14px 0 7px}.color-popup-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.color-popup-choice{position:relative;aspect-ratio:1;padding:0;border:3px solid transparent;border-radius:12px;box-shadow:none}
.color-popup-choice.active{border-color:var(--text);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--text)}
.edit-custom,.used-badge{position:absolute;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:#fff;color:#111;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.edit-custom{right:4px;bottom:4px}.used-badge{left:4px;top:4px;font-size:11px}
.color-popup-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:16px}.color-popup-actions button{min-width:120px}
.color-wheel-wrap{display:flex;flex-direction:column;align-items:center;gap:13px}
.color-wheel{position:relative;width:min(300px,78vw);height:min(300px,78vw);border-radius:50%;background:conic-gradient(red,#ff0,#0f0,#0ff,#00f,#f0f,red);touch-action:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3),0 10px 28px var(--ui-shadow)}
.color-wheel::after{content:'';position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,#fff 0%,transparent 72%);pointer-events:none}
.wheel-cursor{position:absolute;width:22px;height:22px;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 2px #111;transform:translate(-50%,-50%);z-index:4;pointer-events:none}
.color-value-row{display:grid;grid-template-columns:1fr 100px;gap:10px;width:100%;align-items:center}.color-preview{height:46px;border-radius:12px;border:1px solid var(--line)}
.color-hex-wrap{display:grid;gap:4px}.color-hex-wrap label{font-size:11px;font-weight:800;color:var(--muted);text-align:center}
.color-hex-input{width:100%;padding:10px;text-align:center;font-weight:800;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line);border-radius:10px}
.color-hex-input.invalid{border-color:var(--red);box-shadow:0 0 0 3px rgba(229,56,74,.18)}
.color-sliders{width:100%;display:grid;gap:10px}.color-sliders label{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.color-sliders input{width:100%;accent-color:var(--brand-ui)}
.color-wheel-error{display:none;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--red);background:rgba(229,56,74,.1);color:var(--red);font-size:13px;font-weight:800;text-align:center}
.color-wheel-error.show{display:block}.color-wheel-reset{width:100%;margin-top:14px}
@media(max-width:500px){.color-popup-grid{grid-template-columns:repeat(4,1fr)}}

/* Dialoge, Toast, Vorschau */
.modal-backdrop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(8,12,24,.66);backdrop-filter:blur(6px);animation:fade .2s both}
.modal-card{width:min(430px,100%);max-height:90dvh;overflow:auto;padding:22px;border-radius:24px;background:var(--panel);border:1px solid var(--line);box-shadow:0 24px 70px var(--ui-shadow);animation:pop .35s var(--ease) both}
.modal-card h3{font-size:22px}.modal-card p{color:var(--muted);line-height:1.5;margin-bottom:18px}
.modal-actions{display:grid;gap:9px}.reset-opt{display:flex;gap:10px;align-items:flex-start;padding:10px 0}.reset-opt input{margin-top:4px;accent-color:var(--brand-ui)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));z-index:80;display:none;max-width:min(92vw,420px);padding:11px 16px;border-radius:14px;background:var(--panel);color:var(--text);border:1px solid var(--line);box-shadow:0 10px 30px var(--ui-shadow);font-weight:700;transform:translateX(-50%);animation:toast .3s var(--ease) both}
.rod-peek{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;pointer-events:none;background:rgba(0,0,0,.4)}
.rod-peek-card{width:min(92vw,480px);padding:14px 16px;border-radius:18px;background:var(--panel);box-shadow:0 18px 50px rgba(0,0,0,.4);animation:pop .25s var(--ease) both}
.peek-chip{display:inline-block;margin-top:8px;padding:6px 10px;border-radius:999px;background:var(--brand-soft);font-weight:800;font-size:14px}

/* Bewegung */
.screen:not(.hidden){animation:enter .3s var(--ease) both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.92)}60%{transform:scale(1.03)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,12px)}}
@keyframes drop{from{opacity:0;transform:translateY(-18px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-delay:0s!important;transition-duration:.001ms!important}}
@media(max-width:560px){.game-nav button span:not(.book-icon){display:none}.tag{display:none}.hero{padding:30px 16px 20px}.card{padding:15px}.game-nav button span:not(.book-icon){font-size:13px}}

/* Startseite: Weiterspielen */
#heroCta{display:grid;gap:10px}.has-continue #btnStory{background:var(--panel2);color:var(--text);border-color:var(--line);box-shadow:none;font-size:16px;padding:13px}
#game>.card:first-child{padding:14px 8px}#game>.card:first-child>*:not(.board-wrap){margin-inline:6px}
/* Story-Pfad */
.story-chapter{padding:14px 12px 6px;border:1px solid var(--line);border-radius:20px;background:var(--panel2)}
.story-node-grid{position:relative;margin-bottom:12px}
.story-node-grid::before{content:'';position:absolute;left:6%;right:6%;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:var(--line)}
.story-node{z-index:1;background:var(--panel)}.story-node.done{background:color-mix(in srgb,var(--green) 14%,var(--panel))}
.story-node.next{border-color:var(--brand-ui);border-width:2px;animation:ring 2s ease-out infinite}
.story-hurdle{background:var(--panel)}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--brand-soft)}70%,100%{box-shadow:0 0 0 9px transparent}}
#inventoryNote{display:none}.inv-free{min-height:44px;align-items:center}

/* Nachlegen */
.place-bar{margin:10px 6px 0;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel2);animation:enter .25s var(--ease) both}
.pb-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.pb-x{padding:4px 10px;border-radius:10px}
.pb-rods{display:flex;flex-wrap:wrap;gap:6px}
.pb-rod{position:relative;min-width:38px;height:38px;padding:0;border-radius:10px;background:var(--c);color:var(--ink);border:2px solid transparent}
.pb-rod.on{border-color:var(--text);box-shadow:0 0 0 2px var(--panel2),0 0 0 4px var(--text)}
.pb-rod.mine::after{content:'';position:absolute;right:3px;top:3px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.pb-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.pb-acts:has(button:only-child){grid-template-columns:1fr}
.slot-zone{fill:transparent;pointer-events:all;cursor:pointer}
.slot-plus{fill:#8793a6;font-size:30px;font-weight:700;text-anchor:middle;opacity:.55;pointer-events:none}
.slot.target .slot-zone{fill:var(--brand-soft);stroke:var(--brand-ui);stroke-width:2;stroke-dasharray:6 6}
.slot.sel .slot-zone{fill:var(--brand-soft);stroke:var(--brand-ui);stroke-width:3}
.ghost{opacity:.6;pointer-events:none;animation:fade .2s both}
.wobble{transform-box:fill-box;transform-origin:center;animation:wob .48s ease-in-out}
@keyframes wob{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.inv-free,.inv-mine{cursor:pointer}.inv.sel{box-shadow:0 0 0 3px var(--brand-ui)}

.pb-rod{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pb-tools{display:flex;gap:8px;margin-top:10px}.pb-tool{flex:1;padding:9px 10px;font-size:14px}
.pb-head+.pb-rods+.side-profile-wrap,.place-bar .side-profile-wrap{margin-top:10px;padding:8px 10px}.place-bar .side-profile-wrap svg{display:block;width:100%;height:auto;max-height:96px}
.slot-lane{fill:transparent;pointer-events:all;cursor:pointer}
.howto-bullets{margin:0;padding-left:20px;display:grid;gap:8px}.howto-bullets li{color:var(--muted);line-height:1.5}
.pb-rel{margin-top:6px;text-align:center;font-size:13px;font-weight:800;color:var(--muted)}.peek-chip{font-size:13px}

/* Animationen: Einlegen, Sterne, Freischalten */
@keyframes slideV{from{opacity:0;transform:translateY(-90px)}}
@keyframes slideH{from{opacity:0;transform:translateX(-90px)}}
.svg-v-rod.slide-in{animation:slideV .45s var(--ease) both}.svg-h-rod.slide-in{animation:slideH .45s var(--ease) both}
.star-burst{display:flex;justify-content:center;gap:8px;font-size:44px;line-height:1;margin-bottom:6px}
.star-burst span{color:var(--line);opacity:.6}
.star-burst span.on{color:#FFC83D;opacity:1;animation:starIn .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:var(--d,0ms);text-shadow:0 0 14px rgba(255,200,61,.55)}
@keyframes starIn{from{opacity:0;transform:scale(.2) rotate(-40deg)}}
@keyframes unlock{0%{box-shadow:0 0 0 0 rgba(255,200,61,.8);transform:scale(.9)}40%{transform:scale(1.08)}100%{box-shadow:0 0 0 18px rgba(255,200,61,0);transform:scale(1)}}
.story-node.unlock-glow{animation:unlock 1s var(--ease) 3 .3s}
@media (prefers-reduced-motion:reduce){.svg-v-rod.slide-in,.svg-h-rod.slide-in,.star-burst span.on,.story-node.unlock-glow{animation:none}}

/* Schwebende Legeleiste (unten) + deutliche Markierung der gewählten Reihe/Spalte */
.place-bar{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;z-index:60;border-radius:20px 20px 0 0;border-bottom:0;background:var(--panel);box-shadow:0 -10px 32px rgba(0,0,0,.4);padding:10px 12px calc(10px + env(safe-area-inset-bottom));max-height:52vh;overflow-y:auto;animation:sheet .25s var(--ease) both}
@keyframes sheet{from{transform:translateY(40px);opacity:0}}
body:not(.in-game) .place-bar{display:none}
body.pb-open #game{padding-bottom:var(--pb-h,0)}html{scroll-padding-bottom:var(--pb-h,0)}
.place-bar .pb-head{margin-bottom:6px}.pb-hbtns{display:flex;gap:6px;align-items:center}
.pb-mini{padding:4px 10px;border-radius:10px;font-size:13px}.pb-mini:disabled{opacity:.35}
.place-bar .pb-rods{flex-wrap:nowrap;overflow-x:auto;padding:3px 2px 6px;scrollbar-width:none}.place-bar .pb-rods::-webkit-scrollbar{display:none}.place-bar .pb-rod{flex:0 0 auto}
.place-bar .side-profile-wrap{margin-top:4px;padding:4px 10px}.place-bar .side-profile-wrap svg{max-height:60px}.place-bar .pb-rel{margin-top:2px;font-size:12px}
.place-bar .pb-acts{display:flex;gap:6px;margin-top:8px}.place-bar .pb-acts button{flex:1;padding:10px 4px;font-size:14px;white-space:nowrap}
.slot-hl{fill:var(--brand-ui);fill-opacity:.16;stroke:var(--brand-ui);stroke-width:4;pointer-events:none;animation:hlpulse 1.4s ease-in-out infinite}
@keyframes hlpulse{50%{fill-opacity:.3;stroke-opacity:.6}}
@media (prefers-reduced-motion:reduce){.slot-hl,.place-bar{animation:none}}
/* Auswahl: keine Eck-Felder mehr, dezentes gelbes Band statt rotem Rahmen */
.slot.target .slot-zone,.slot.sel .slot-zone{fill:transparent;stroke:none}
.slot-hl{fill:#FFD84A;fill-opacity:.1;stroke:#FFD84A;stroke-width:3;stroke-dasharray:3 9;stroke-linecap:round;rx:14}
@keyframes hlpulse{50%{fill-opacity:.2;stroke-opacity:.55}}
.slot-hl{fill-opacity:.05!important;stroke-width:2.5}@keyframes hlpulse{50%{stroke-opacity:.5}}

/* ===== Druck-Look: warmes Papier, Schichtlinien, kräftige Formen ===== */
:root{--bg:#f4efe5;--panel:#fffdf8;--panel2:#f6f1e6;--line:#e2d9c6;--text:#1c2130;--muted:#645f55;--ui-shadow:rgba(60,45,20,.16);--shelf:#d9cfb8}
html.dark-mode{--bg:#0e1220;--shelf:#050813}
body{background:repeating-linear-gradient(0deg,rgba(60,45,20,.035) 0 1px,transparent 1px 5px),radial-gradient(120% 50% at 50% -8%,var(--brand-soft),transparent 60%),var(--bg)}
html.dark-mode body{background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px),radial-gradient(120% 50% at 50% -8%,var(--brand-soft),transparent 60%),var(--bg)}
.card{border:2px solid var(--line);border-radius:26px;box-shadow:0 5px 0 var(--shelf)}
button{border-width:2px;border-bottom-width:4px;border-radius:16px}
button:active{transform:translateY(2px);border-bottom-width:2px}
h2,h3,.difficulty-title{font-weight:900;letter-spacing:-.01em}
/* Startseite */
.hero-brand{text-align:center;padding-bottom:20px}
.progress-card{padding-top:14px;padding-bottom:14px}
.tile-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.tile{display:flex;flex-direction:column;gap:6px}
.tile-btn{width:100%;min-height:108px;border-radius:22px;font-size:17px;font-weight:900;line-height:1.25;white-space:normal;text-align:center;background:var(--panel);border-color:var(--line);box-shadow:0 4px 0 var(--shelf)}
.tile .muted{font-size:12.5px;margin:0;text-align:center}
.mini-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini-row button{padding:10px 6px;font-size:13.5px}
/* Story als Pfad */
.story-chapter{border:2px solid var(--line);border-left:8px solid var(--chc,var(--line));border-radius:20px;background:var(--panel);padding:12px 12px 6px}
.story-chapter.locked-chapter{opacity:.8;background:var(--panel2);border-style:dashed;border-left-style:solid}
.story-chapter-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.story-node-grid{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:16px}
.story-node-grid.rev{direction:rtl}.story-node-grid.rev>*{direction:ltr}
.story-node-grid::before{left:10%;right:10%;height:6px;margin-top:-3px;background:repeating-linear-gradient(90deg,var(--chc) 0 14px,transparent 14px 22px);opacity:.55;border-radius:6px}
.story-node-grid::after{content:'';position:absolute;right:10%;bottom:-16px;width:6px;height:16px;margin-right:-3px;background:var(--chc);opacity:.55}
.story-node-grid.rev::after{right:auto;left:10%;margin:0 0 0 -3px}
.story-node{aspect-ratio:1;min-height:0;border-radius:50%;padding:0;border:3px solid var(--line);border-bottom-width:5px;background:var(--panel)}
.story-node.done{background:var(--chc);border-color:var(--chc);color:#fff}.story-node.done .mini-stars{color:#fff}
.story-node.next{border-color:var(--chc);box-shadow:0 0 0 4px color-mix(in srgb,var(--chc) 25%,transparent)}
.story-node.locked{background:var(--panel2);border-style:dashed}
.story-node .num{font-size:18px}
.story-hurdle{border-radius:14px;border:2px dashed var(--line);margin:0 0 14px}
.setting-row.danger{border-color:var(--line)}
/* Einführungs-Overlay */
.intro-row{display:flex;gap:12px;align-items:flex-start;margin:10px 0}.intro-row span{font-size:26px;line-height:1.2;flex:0 0 34px;text-align:center}.intro-row p{margin:0;font-size:15.5px;line-height:1.4}
.help-q{width:40px;height:40px;padding:0;border-radius:50%;font-size:20px;font-weight:900;margin-left:auto;flex:0 0 auto}
#menu .top{display:flex;align-items:center;gap:10px}
#bookHomeText{display:none}
/* Pfad: durchgehende Linien, Farbverlauf zwischen Kapiteln */
.story-node-grid::before{height:8px;margin-top:-4px;background:var(--chc);opacity:.6;border-radius:4px;left:10%;right:10%}
.story-node-grid::after{width:8px;height:18px;bottom:-18px;margin-right:-4px;background:var(--chc);opacity:.6;border-radius:0}
.story-node-grid.rev::after{margin:0 0 0 -4px}
.story-hurdle{position:relative}
.story-hurdle::after{content:'';position:absolute;bottom:-14px;width:8px;height:14px;background:var(--chc);opacity:.6}
.story-hurdle.r::after{right:calc(10% - 4px)}.story-hurdle.l::after{left:calc(10% - 4px)}
.story-path{display:flex;flex-direction:column}
.chapter-link{position:relative;height:30px;margin:-4px 14px -4px 24px;z-index:2;pointer-events:none}
.chapter-link::before{content:'';position:absolute;top:-14px;bottom:-14px;width:8px;background:linear-gradient(var(--a),var(--b));border-radius:4px}
.chapter-link.r::before{right:calc(10% - 4px)}.chapter-link.l::before{left:calc(10% - 4px)}
.story-chapter+.story-chapter{margin-top:0}
.story-node{position:relative;z-index:1}.story-node.locked{background:var(--panel2)}.story-node-grid::before,.story-node-grid::after{z-index:0}
.story-node:disabled{opacity:1}.story-node.locked{background:var(--panel2);color:var(--muted)}
.chapter-link::before{top:-30px;bottom:-30px}
.story-node-grid:last-child::after{display:none}
.chapter-link{z-index:0}.story-chapter{position:relative;z-index:1}.chapter-link::before{top:-6px;bottom:-6px}
/* Pfad v3: lückenlos (Linien deckend, Kopf zentriert, Zuführung in die nächste Karte) */
.story-chapter{--chl:color-mix(in srgb,var(--chc) 62%,var(--panel))}
.story-node-grid::before,.story-node-grid::after,.story-hurdle::after{background:var(--chl);opacity:1}
.story-chapter-head{height:30px;justify-content:center;gap:10px;margin-bottom:10px}
.chapter-link{margin-left:20px;margin-right:14px}
.chapter-link::before{background:linear-gradient(color-mix(in srgb,var(--a) 62%,var(--panel)),color-mix(in srgb,var(--b) 62%,var(--panel)))}
.story-chapter>.story-hurdle:last-child::after{bottom:-22px;height:22px}
.story-chapter.lead::before{content:'';position:absolute;top:-8px;height:90px;width:8px;background:var(--chl);z-index:0;border-radius:0 0 0 0}
.story-chapter.lead.r::before{right:calc(14px + (100% - 34px) * .1 - 4px)}
.story-chapter.lead.l::before{left:calc(20px + (100% - 34px) * .1 - 4px)}
.story-chapter>*{position:relative}
.story-chapter-head{z-index:1}
.story-chapter.lead.r::before{right:calc(12px + (100% - 24px) * .1 - 4px)}
.story-chapter.lead.l::before{left:calc(12px + (100% - 24px) * .1 - 4px)}
.chapter-link::before{top:-24px;bottom:-24px}
.story-chapter.locked-chapter{opacity:1}.story-chapter.locked-chapter>*{opacity:.75}
/* Pfad v4: exakt mittig unter/über den Kreisen */
.story-node-grid{--cx:calc((100% - 24px) / 10)}
.story-node-grid::before{left:var(--cx);right:var(--cx)}
.story-node-grid::after{right:calc((100% - 24px) / 10 - 4px);margin:0}
.story-node-grid.rev::after{right:auto;left:calc((100% - 24px) / 10 - 4px);margin:0}
.story-node-grid.tail::after{display:block;bottom:-24px;height:24px}
.story-hurdle.r::after{right:calc((100% - 24px) / 10 - 4px)}.story-hurdle.l::after{left:calc((100% - 24px) / 10 - 4px)}
.chapter-link.r::before{right:calc((100% - 24px) / 10 - 4px)}.chapter-link.l::before{left:calc((100% - 24px) / 10 - 4px)}
.story-chapter.lead.r::before{right:calc(12px + (100% - 48px) / 10 - 4px)}
.story-chapter.lead.l::before{left:calc(12px + (100% - 48px) / 10 - 4px)}
/* Pfad v5: eine Linie je Bereichswechsel */
.path-link{position:absolute;width:8px;z-index:3;pointer-events:none;background:linear-gradient(color-mix(in srgb,var(--a) 62%,var(--panel)),color-mix(in srgb,var(--b) 62%,var(--panel)))}
.story-chapter.lead::before,.chapter-link::before{display:none}
.story-node-grid.tail::after{display:none}
.story-chapter>.story-hurdle:last-child::after{display:none}
.path-link{z-index:0}.story-chapter{z-index:auto}
.story-chapter>*{z-index:1}
.story-node-grid::after,.story-hurdle::after{display:none!important}
/* Bild-Tutorial */
.tut-card{position:relative;max-width:420px;text-align:center}
.tut-step{font-size:12.5px;font-weight:800;color:var(--muted);margin-bottom:6px}
.tut-art{min-height:250px;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.tut-svg{width:100%;max-width:290px;height:auto;display:block}
.tut-lab{fill:#FFD84A;font-size:30px;font-weight:900}.tut-q{fill:#FFD84A;font-size:70px;font-weight:900}
.tut-title{margin:0 0 6px;font-size:21px}.tut-text{margin:0 0 12px;font-size:15px;line-height:1.45;color:var(--text)}
.tut-dots{display:flex;gap:6px;justify-content:center;margin-bottom:12px}.tut-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.tut-dots i.on{background:var(--brand-ui);width:22px;border-radius:6px}
.tut-actions{display:flex;gap:10px}.tut-actions button{flex:1}
.tut-rules{margin-top:10px;width:100%}
.tut-close{position:absolute;top:10px;right:10px;width:34px;height:34px;padding:0;border-radius:50%}
.tut-sticks{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}.tut-stick small{display:block;margin-top:4px;color:var(--muted);font-weight:800}

.tut-cells{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tut-cell{padding:8px;border-radius:16px;border:2px solid var(--line);background:var(--viz-bg);display:flex;flex-direction:column;align-items:center;gap:2px}
.tut-cell svg{width:84px;height:84px}.tut-cell b{font-size:14px}.tut-cell small{font-size:12px;color:var(--viz-text)}
.tut-cell.ok{border-color:var(--green)}.tut-cell.ok b{color:var(--green)}.tut-cell.bad{border-color:var(--red)}.tut-cell.bad b{color:var(--red)}
.tut-cta .primary{width:100%;margin-top:6px}
.tut-sticks{grid-template-columns:1fr;gap:14px}.tut-sticks .inv-stick-svg{width:100%;height:auto}.tut-stick small{margin-top:2px}

.kid-offer{background:transparent!important;box-shadow:none!important;border:0!important;font-weight:600;opacity:.85;min-height:40px}

/* Stern: Stab-Look (gelber Körper, dunkle Kontur) */
.ic-w[data-g="⭐"] .ic{--sf:var(--brand-ui,#f5c82e);--ss:#1c2230;--sh:rgba(255,255,255,.55)}
.nav-home{box-shadow:none!important}
.dark-mode .ic-w[data-g="⭐"] .ic{--ss:var(--ol)}

/* Lesbare Schrift auf Kapitel-/Akzentfarbe, auch bei weissem oder sehr hellem Stab */
@supports (color:oklch(from red calc(l) c h)){
 .story-node.done,.story-node.done .mini-stars{color:oklch(from var(--chc) calc((0.68 - l) * 1000) 0 0)}

.story-node.done{border-color:color-mix(in srgb,var(--chc) 55%,#000)}

:root{--ol:rgba(28,34,48,.9)}

/* Stufenbalken als Stab-Pille mit Kontur (statt dicker Rand-Kante) */
.story-chapter{position:relative;border-left:2px solid var(--line)!important;padding-left:19px!important;padding-right:19px!important}

:root{--brand-edge:color-mix(in srgb,var(--brand-ui) 50%,#000)}
.dark-mode{--brand-edge:color-mix(in srgb,var(--brand-ui) 50%,#fff)}

<script>
/* AlignStix – Update-Check (Version muss mit version.json und sw.js übereinstimmen) */
const FLIP_APP_VERSION='142';
(function(){
  if(location.protocol==='file:')return;
  var busy=false;
  async function wipe(unreg){
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    if(unreg){try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(r=>r.unregister()))}catch(e){}}
  }
  async function check(){
    if(busy||!navigator.onLine)return; busy=true;
    try{
      const r=await fetch('./version.json?cb='+Date.now(),{cache:'no-store'});
      const info=r.ok?await r.json():null; const latest=String(info&&info.version||'');
      if(!latest||latest===FLIP_APP_VERSION){busy=false;return}
      let n=0;try{n=+(sessionStorage.getItem('flipstix_upd_'+latest)||0)}catch(e){}
      if(n>=2){busy=false;return}
      try{sessionStorage.setItem('flipstix_upd_'+latest,String(n+1))}catch(e){}
      try{const rs=await navigator.serviceWorker.getRegistrations();await Promise.all(rs.map(x=>x.update()))}catch(e){}
      await wipe(n>=1);
      location.reload();
    }catch(e){busy=false}
  }
  check();
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')check()});
  window.addEventListener('focus',check);
  window.addEventListener('pageshow',function(e){if(e.persisted)check()});
  setInterval(check,30*60*1000);
})();
</script>

 en:{placeD4:'Press and hold a stick number to see both sides. Your layout is only a memory aid – the app checks it only when you use a hint.',placeD3:'Place sets the stick, Remove takes it off. Undo and Clear board help you tidy up.',placeD2:'Set the position: Flip shows the other side (● or ▲), Rotate swaps the ends. The preview shows how the stick lies.',placeD1:'Tap a free row or column – or a free stick in the inventory. You can also tap sticks you have already placed.',placeT:'Copy your board',hurdleTitle:'Still locked',gotIt:'Got it',hurdleIntro:'You have only solved {a}/5 introduction tasks. Please solve all 5 introduction tasks to unlock the next level.',hurdleStars:'You only have {a}/{b} ⭐ in tasks 1–{n}. Earn at least {b} stars to unlock this hurdle.',levelNext:'Next level: {name}',levelPrev:'Previous level: {name}',firstTask:'This is the first task.',lastTask:'This is the last task.',legendHint:'Revealed by hint',andWord:'and',peekVisible:'visible in this task',peekNoteUsed:'The highlighted half is the one that counts at the crossings. The visible side is on top.',setLook:'Language & appearance',setRods:'Sticks',setData:'Progress & data',setInfo:'Info',rowRodsT:'Sticks & patterns',rowRodsD:'View all 10 sticks with both sides and notches – you can also change the stick colors here.',rowExportT:'Back up progress',rowExportD:'Saves progress, bookmarks and colors to a file.',rowImportT:'Restore progress',rowImportD:'Restores a saved progress file.',rowResetT:'Reset …',rowResetD:'Selectively delete Story, task book, bookmarks, colors or language.',tipStars:'Collected Story stars',tipHelps:'Available hints',tipHome:'Go to start page',tipBackLevel:'Back to task overview',tipBack:'Back',tipRules:'Open the rules',tipFavAdd:'Save as bookmark',tipFavDel:'Remove bookmark',tipSolve:'Mark task as solved – stars depend on the hints you used',tipReveal:'Reveal the solution (with confirmation)',tipPrev:'Previous task',tipNext:'Next task',tipGameStars:'Possible stars: 3 w ome:'Pick any of the 105 tasks freely – no stars, no hints. Just like a real puzzle book.',bookIntro:'Choose any task in any order. There are no stars and no hints here: solve the task with the real sticks and check your result by revealing the solution. 👁 = solution viewed before.',bookNote:'Task book: free choice, no stars, no hints.',reveal:'👁 Reveal solution',hideSolution:'Hide solution',revealTitle:'Really reveal the solution?',revealText:'You will see the finished board. It is best to try the task yourself first – you can hide the solution again at any time.',revealYes:'Yes, show solution',bookSolutionShown:'Solution is shown.',solutionLbl:'Solution',guideRodsBtn:'View sticks & patterns',editColor:'Edit color',rodColorTitle:'Stick color',restoreStandard:'↺ Restore standard color',restoreStandardShort:'↺ Standard color',tagline:'THE LOGIC STICK PUZZLE',tag:'THE LOGIC STICK PUZZLE',intro:'Place the given sticks correctly and find the one valid solution.',story:'Story Mode',guide:'📖 Game Rules',rods:'Sticks & Patterns',progress:'Your Progress',done:'✓ Completed',favorites:'🔖 Bookmarks',playData:'Game & Settings',settings:'Settings',dataText:'Manage language, stick colors and saved progress.',back:'Back',guideTitle:'Game Rules',rodsTitle:'Sticks & Patterns',settingsTitle:'Settings',language:'Language',theme:'Appearance',themeLight:'Light',themeDark:'Dark',themeAuto:'Automatic',colors:'Stick Colors',colorsIntro:'Tap a stick’s color square to open the color wheel and adjust that stick directly. You can restore the stick’s standard color there at any time.',resetColorsBtn:'Reset all stick colors',resetColorsTitle:'Reset stick colors?',resetColorsText:'Do you really want to reset the colors of all 10 sticks to their original colors?',yesResetColors:'✓ Yes, reset stick colors',settingsRodsTitle:'Sticks & Patterns',settingsRodsText:'View the profiles of all 10 sticks here.',settingsRodsBtn:'Sticks & Patterns',export:'Export progress',import:'Import progress',resetLabel:'⚠️ Reset …',about:'About AlignStix',aboutText:'AlignStix • Flip. Fit. Solve. • Offline',setup:'Game Setup',setupText:'The game uses a 5×5 grid and 10 sticks. Each stick can lie horizontally or vertically, be turned around (ends swap) or flipped over (other side up).',goal:'Goal',goalText:'Complete the given sticks so that exactly one valid final position remains.',orientation:'Orientation & Sides',orientationText:'● marks side A, ▲ marks side B. The number at the other end identifies the stick. When a stick is turned around, its ends swap places.',rules:'Rules',rulesText:'At every crossing, the sticks must fit together: one side needs a notch, while the other side must be solid. Two notches or two solid sections cannot meet.',markersTitle:'Large and small markers',markersText:'A marking means the stick has a notch at that spot – without a marking it is solid. The large square (two lines across the stick) shows a notch on the visible side; the small square shows a notch on the underside of a horizontal stick.',visual:'Visualization',visualText:'All 10 sticks are shown in their real side profile – with ● on top and ▲ below. The displayed notches correspond to the notches on the physical sticks.',appRole:'Role of the App',appRoleText:'The app is your task and rule book. Solve the actual puzzle using the physical AlignStix board.',rewardsTitle:'Stars & Hints',rewardsText:'For each completed task, you can earn up to 3 stars: ⭐⭐⭐ without a hint, ⭐⭐ with 1 hint, and ⭐ with 2 or more hints. You start with 3 hints. For every 10 Story Mode stars you collect in total, you receive 1 additional hint. Your stars depend on how many hints you used for that task – the time you needed does not affect the stars.',rodsIntroNew:'Each stick is shown from both sides. ● = side A, ▲ = side B. 1 means a notch; 0 means solid.',bothSides:'Sides A + B',sideProfileTitle:'The stick from the side',sideProfileText:'The end with ● is shown on top and the end with ▲ below. The number at the other en ompleted! 🎉',nextText:'What would you like to do next?',appResetTitle:'Reset app completely?',appResetText:'Progress, hints, bookmarks and settings will be deleted completely.',yesResetApp:'⚠️ Yes, reset app',resetDone:'Reset done',saveFilePrefix:'AlignStix Save',input:'Input'},
 fr:{placeD4:'Maintiens un numéro de bâton pour voir les deux faces. Ton plateau n’est qu’un aide-mémoire : l’app ne le vérifie que si tu utilises un indice.',placeD3:'Poser fixe le bâton, Retirer l’enlève. Annuler et Vider le plateau t’aident à ranger.',placeD2:'Règle la position : Retourner montre l’autre face (● ou ▲), Pivoter échange les extrémités. L’aperçu montre comment le bâton est posé.',placeD1:'Touche une ligne ou une colonne libre – ou un bâton libre dans l’inventaire. Tu peux aussi toucher un bâton déjà posé.',placeT:'Reproduire ton plateau',hurdleTitle:'Encore verrouillé',gotIt:'Compris',hurdleIntro:'Tu n’as résolu que {a}/5 défis d’introduction. Résous les 5 défis d’introduction pour débloquer le niveau suivant.',hurdleStars:'Tu n’as que {a}/{b} ⭐ dans les défis 1–{n}. Obtiens au moins {b} étoiles pour débloquer ce palier.',levelNext:'Niveau suivant : {name}',levelPrev:'Niveau précédent : {name}',firstTask:'C’est le premier défi.',lastTask:'C’est le dernier défi.',legendHint:'Dévoilé par indice',andWord:'et',peekVisible:'visible dans ce défi',peekNoteUsed:'La moitié en surbrillance est celle qui compte aux croisements. La face visible est en haut.',setLook:'Langue et affichage',setRods:'Bâtons',setData:'Progression et données',setInfo:'Infos',rowRodsT:'Bâtons et motifs',rowRodsD:'Voir les 10 bâtons avec les deux côtés et les encoches – tu peux aussi y changer les couleurs.',rowExportT:'Sauvegarder la progression',rowExportD:'Enregistre progression, marque-pages et couleurs dans un fichier.',rowImportT:'Restaurer la progression',rowImportD:'Restaure une sauvegarde depuis un fichier.',rowResetT:'Réinitialiser …',rowResetD:'Supprimer au choix le mode Histoire, le livre, les marque-pages, les couleurs ou la langue.',tipStars:'Étoiles du mode Histoire collectées',tipHelps:'Indices disponibles',tipHome:'Aller à l’accueil',tipBackLevel:'Retour à l’aperçu des défis',tipBack:'Retour',tipRules:'Ouvrir les règles',tipFavAdd:'Enregistrer comme marque-page',tipFav d un bâton mal placé. Si aucun n’est faux, il ajoute un bâton de plus de la solution. Dans les deux cas, il coûte un indice et compte pour les étoiles.',hintStart:'Tu commences avec 3 indices.',hintEarn:'Chaque tranche de 10 étoiles du Mode Histoire donne 1 indice de plus.',timeNote:'Seuls les indices comptent – pas le temps.',exampleBoard:'Voir un exemple sur le plateau',legendLines:'Encoche visible (grand carré)',legendSquare:'Encoche sur la face inférieure (petit carré)',book:'📚 Livre d’énigmes',bookHome:'Choisis librement parmi les 105 défis – sans étoiles ni indices. Comme dans un vrai livre d’énigmes.',bookIntro:'Choisis n’importe quel défi dans l’ordre que tu veux. Ici, pas d’étoiles ni d’indices : résous le défi avec les vrais bâtons et vérifie ton résultat en dévoilant la solution. 👁 = solution déjà consultée.',bookNote:'Livre d’énigmes : choix libre, sans étoiles ni indices.',reveal:'👁 Dévoiler la solution',hideSolution:'Masquer la solution',revealTitle:'Dévoiler vraiment la solution ?',revealText:'Tu verras ensuite le plateau terminé. Essaie d’abord toi-même – tu peux masquer la solution à tout moment.',revealYes:'Oui, afficher la solution',bookSolutionShown:'La solution est affichée.',solutionLbl:'Solution',guideRodsBtn:'Voir les bâtons et motifs',editColor:'Modifier la couleur',rodColorTitle:'Couleur du bâton',restoreStandard:'↺ Rétablir la couleur standard',restoreStandardShort:'↺ Couleur standard',tagline:'LE CASSE-TÊTE LOGIQUE À BÂTONNETS',tag:'CASSE-TÊTE LOGIQUE À BÂTONNETS',intro:'Place les bâtons donnés correctement et trouve l’unique solution valide.',story:'Mode Histoire',guide:'📖 Règles du jeu',rods:'Bâtons & motifs',progress:'Ta progression',done:'✓ Terminé',favorites:'🔖 Signets',playData:'Jeu & réglages',settings:'Réglages',dataText:'Gérer la langue, les couleurs des bâtons et la progression.',back:'Retour',guideTitle:'Règles du jeu',rodsTitle:'Bâtons & motifs',settingsTitle:'Réglages',language:'Langue',settingsRodsTitle:'Bâtons & motifs',settingsRodsText:'Ici, tu peux voir les profils des 10 bâtons.',settingsRodsBtn:'Bâtons & motifs',theme:'Apparence',themeLight:'Clair',themeDark:'Sombre',themeAuto:'Automatique',colors:'Couleurs des bâtons',colorsIntro:'Touche le carré de couleur d’un bâton pour ouvrir directement la roue chromatique et ajuster ce bâton. Tu peux y rétablir à tout moment sa couleur standard.',resetColorsBtn:'Réinitialiser toutes les couleurs des bâtons',resetColorsTitle:'Réinitialiser les couleurs des bâtons ?',resetColorsText:'Voulez-vous vraiment réinitialiser les couleurs des 10 bâtons à leurs couleurs d’origine ?',yesResetColors:'✓ Oui, réinitialiser les couleurs',export:'Exporter la progression',import:'Importer la progression',resetLabel:'⚠️ Réinitialiser …',about:'À propos de AlignStix',aboutText:'AlignStix • Flip. Fit. Solve. • Hors ligne',setup:'Mise en place',setupText:'Le jeu utilise une grille 5×5 et 10 bâtons. Chaque bâton peut être placé horizontalement ou verticalement, tourné (extrémités inversées) ou retourné (autre face dessus).',goal:'But du jeu',goalText:'Complète les bâtons donnés afin qu’une seule position finale valide reste possible.',orientation:'Orientation & côtés',orientationText:'● indique le côté A, ▲ le côté B. Le numéro à l’autre extrémité identifie le bâton.',rules:'Règles',rulesText:'À chaque croisement, les bâtons doivent s’emboîter : un côté doit avoir une encoche et l’autre doit être plein. Deux encoches ou deux parties pleines ne peuvent pas se rencontrer.',markersTitle:'Grands et petits repères',markersText:'Un repère signifie que le bâton a une encoche à cet endroit – sans repère, il est plein. Le grand carré (deux lignes en travers du bâton) indique une encoche sur la face visible ; le petit carré, une encoche sur la face inférieure d’un bâton horizontal.',visual:'Visualisation',visualText:'Les 10 bâtons sont présentés dans leur véritable vue de profil – avec ● en haut et ▲ en bas. Les encoches représentées correspondent à celles des bâtons physi let flipNavReady=false;
let flipNavRestoring=false;
let flipCurrentRouteState=null;

// Global back on Android/iOS closes the top-most popup first.
let modalHistoryActive=false;
let modalHistoryClosing=false;
let modalPendingAction=null;

function visibleModals(){
  return Array.from(document.querySelectorAll('.modal-backdrop:not(.hidden)'));
}
function showModal(id,reuseHistory=false){
  const el=document.getElementById(id);
  if(!el)return;
  if(!modalHistoryActive && !reuseHistory){
    const currentState=history.state||{};
    history.pushState({...currentState,__flipStixModal:true},'',location.href);
    modalHistoryActive=true;
  }else if(reuseHistory){
    modalHistoryActive=true;
  }
  el.classList.remove('hidden');
}
function hideModal(id){
  const el=document.getElementById(id);
  if(el)el.classList.add('hidden');
}
function closeModal(id){
  hideModal(id);
  if(visibleModals().length)return;
  if(modalHistoryActive){
    modalHistoryClosing=true;
    history.back();
  }
}
function closeModalKeepHistory(id){
  hideModal(id);
}
function closeModalThen(id,action){
  hideModal(id);
  if(visibleModals().length){
    if(typeof action==='function')action();
    return;
  }
  if(!modalHistoryActive){
    if(typeof action==='function')action();
    return;
  }
  modalPendingAction=typeof action==='function'?action:null;
  modalHistoryClosing=true;
  history.back();
}
function flipRouteSame(a,b){
  if(!a||!b||a.view!==b.view)return false;
  if(a.view==='diff')return a.difficulty===b.difficulty;
  if(a.view==='game')return a.id===b.id&&(a.mode||'story')===(b.mode||'story');
  if(a.view==='lists')return (a.type||'done')===(b.type||'done');
  return true;
}
function flipNavPush(route){
  if(!flipNavReady || flipNavRestoring) return;
  const currentState=history.state||flipCurrentRouteState||{};
  // Do not create another browser-history entry when the same menu is opened again.
  if(currentState.__flipStixRoute && flipRouteSame(currentState,route)){
    flipCurrentRouteState=currentState;
    return;
  }
  const currentIndex=Number.isFinite(currentState.__flipStixIndex)?currentState.__flipStixIndex:0;
  const nextIndex=currentIndex+1;
  const nextState={...route,__flipStixRoute:true,__flipStixIndex:nextIndex,__flipStixParentIndex:currentIndex};
  history.pushState(nextState,'',location.href);
  flipCurrentRouteState=nextState;
}
function flipNavReplaceGame(route){
  if(!flipNavReady || flipNavRestoring) return;
  const currentState=history.state||flipCurrentRouteState||{};
  if(currentState.__flipStixRoute && currentState.view==='game'){
    const nextState={...currentState,...route,__flipStixRoute:true};
    history.replaceState(nextState,'',location.href);
    flipCurrentRouteState=nextState;
  }else{
    flipNavPush(route);
  }
}
function flipNavRestore(state){
  if(!state||!state.__flipStixRoute) return;
  flipNavRestoring=true;
  try{
    switch(state.view){
      case 'home': flipRestoreMenu('home'); renderHome(); break;
      case 'story': openStory(); break;
      case 'stamps': openStamps(); break;
      case 'diff': chooseDiff(state.difficulty); break;
      case 'game': if(state.id){ if(state.mode==='book') openBookPuzzle(state.id); else openPuzzle(state.id); } else { section('home'); renderHome(); } break;
      case 'guide': flipRestoreMenu('guide'); renderGuide(); break;
      case 'rods': flipRestoreMenu('rods'); renderRods(); break;
      case 'settings': flipRestoreMenu('settings'); applyLang(); break;
      case 'lists': openLists(state.type||'done'); break;
      case 'book': openBook(); break;
      default: section('home'); renderHome();
    }
  }finally{
    flipNavRestoring=false;
  }
}
function flipNavInit(){
  if(flipNavReady) return;
  const initial={...(history.state||{}),__flipStixRoute:true,__flipStixIndex:0,__flipStixParentIndex:null,view:'home'};
  history.replaceState(initial,'',location.href);
  flipCurrentRouteState=initial;
  window.addEventListener('popstate',()=>{
    if(modalHistoryClosing){
      modalHistoryClosing=false;
      modalHistoryActive=false;
      const action=modalPendingAction;
      modalPendingAction=null;
      if(typeof action==='function')action();
      return;
    }
    const modals=visibleModals();
    if(modalHistoryActive && modals.length){
      hideModal(modals[modals.length-1].id);
      modalHistoryActive=false;
      if(visibleModals().length){
        const currentState=history.state||{};
        history.pushState({...currentState,__flipStixModal:true},'',location.href);
        modalHistoryActive=true;
      }
      return;
    }

    const target=history.state||{};
    const from=flipCurrentRouteState||{};
    const parentIndex=Number.isFinite(from.__flipStixParentIndex)?from.__flipStixParentIndex:null;
    const targetIndex=Number.isFinite(target.__flipStixIndex)?target.__flipStixIndex:null;

    // A system back gesture should move one logical menu level, not one
    // browser-history click. If the target is an intermediate history entry,
    // jump directly to the current route's recorded parent.
    if(from.__flipStixRoute && parentIndex!==null && target.__flipStixRoute && targetIndex!==null && targetIndex!==parentIndex){
      const delta=parentIndex-targetIndex;
      if(delta!==0){
        history.go(delta);
        return;
      }
    }

    flipCurrentRouteState=target.__flipStixRoute?target:null;
    flipNavRestore(target);
  });
  flipNavReady=true;
}

const flipScrollPositions={home:0,menu:0,guide:0,rods:0,settings:0,game:0};

function flipSaveScroll(view=flipVisibleView()){flipScrollPositions[view]=window.scrollY||window.pageYOffset||0}

function flipRestoreMenu(id){section(id);requestAnimationFrame(()=>{window.scrollTo({top:flipScrollPositions[id]||0,left:0,behavior:'auto'});applyDynamicContrast();})}
function section(id){['home','menu','guide','rods','game','settings'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));const hdr=document.getElementById('appHeader');if(hdr)hdr.classList.toggle('hidden',id==='home');document.body.classList.toggle('in-game',id==='game')}

function _hexToRgb(hex){
 const h=String(hex||'').replace('#','');
 if(!/^[0-9a-f]{6}$/i.test(h))return null;
 return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};
}
function _rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('').toUpperCase()}
function _darkenHex(hex,amount=.28){const c=_hexToRgb(hex);if(!c)return '#B91C1C';return _rgbToHex(c.r*(1-amount),c.g*(1-amount),c.b*(1-amount));}
function _brandButtonText(bg){
 const c=_hexRgb(bg);if(!c)return '#F5F7FA';
 const light=_hexRgb('#F5F7FA'),dark=_hexRgb('#0F172A');
 return _contrastRatioRgb(light,c)>=_contrastRatioRgb(dark,c)?'#F5F7FA':'#0F172A';
}
function _isNearWhite(hex){
 const c=_hexToRgb(hex); if(!c)return false;
 return c.r>=245&&c.g>=245&&c.b>=245;
}
function _accentForSurface(accent,darkMode){
 // In light mode only near-white accent colors need a visual adjustment.
 // Yellow, orange and all other saturated colors remain exactly as selected.
 if(darkMode) return accent;
 if(_isNearWhite(accent)) return '#CBD5E1';
 return accent;
}
function applyBrandAccent(){
 const root=document.documentElement;
 const rod1=String(store&&store.colors&&store.colors[0]||'#E31E24').trim();
 const accent=/^#[0-9a-f]{6}$/i.test(rod1)?rod1:'#E31E24';
 const darkMode=root.classList.contains('dark-mode');
 const visible=_accentForSurface(accent,darkMode);
 const ac=_hexToRgb(visible);
 let shadow=_darkenHex(visible,.28);
 // Black may remain black in dark mode, but its shadow must remain visible.
 const raw=_hexToRgb(accent);
 if(darkMode && raw && raw.r<20&&raw.g<20&&raw.b<20) shadow='#374151';
 // Very light accents need a neutral, visible shadow rather than inheriting yellow.
 if(_isNearWhite(accent)) shadow=darkMode?'#94A3B8':'#94A3B8';
 // Keep the shadow visibly distinct from the accent.
 if(String(shadow).toUpperCase()===String(visible).toUpperCase()) shadow=darkMode?'#374151':'#64748B';
 const buttonText=_brandButtonText(accent);
 // --brand is the displayed accent used by all legacy rules.
 // --brand-raw preserves the actual Stick 1 color for diagnostics/derivation.
 root.style.setProperty('--brand-raw',accent);
 {const r2=String(store&&store.colors&&store.colors[1]||'#f6c928').trim();const b2=/^#[0-9a-f]{6}$/i.test(r2)?r2:'#f6c928';root.style.setProperty('--logo-back',b2)}
 root.style.setProperty('--brand',visible);
 root.style.setProperty('--red',visible);
 root.style.setProperty('--brand-ui',accent);
 root.style.setProperty('--brand-ink',accent);
 root.style.setProperty('--brand-shadow',shadow);
 root.style.setProperty('--brand-button-text',buttonText);
 try{const _tx=_hexRgb(darkMode?'#f2f5fb':'#141a26'),_ar=_hexRgb(accent);root.style.setProperty('--ic-ac',(_tx&&_ar&&_contrastRatioRgb(_ar,_tx)<2.4)?(darkMode?'#131b2e':'#fffdf8'):accent)}catch(e){}
 root.style.setProperty('--brand-soft',ac?`rgba(${ac.r},${ac.g},${ac.b},${darkMode?.16:.12})`:'rgba(227,30,36,.12)');
}

 applyDynamicContrast();
}

function storyPuzzles(){return ['intro','easy','medium','hard','impossible'].flatMap(d=>byDiff[d]||[])}
function storyIndex(p){if(!p)return 0;const order={intro:0,easy:5,medium:30,hard:55,impossible:80};return (order[p.difficulty]??999)+Number(p.level||0)}
function totalStoryStars(){return storyPuzzles().reduce((sum,p)=>sum+(store.done[p.id]?.stars||0),0)}
function earnedStoryStarsThrough(n){return storyPuzzles().filter(p=>storyIndex(p)<=n).reduce((sum,p)=>sum+(store.done[p.id]?.stars||0),0)}
const STORY_HURDLES=[5,15,25,30,40,50,55,65,75,80,90,100];
function hurdleRequiredStars(n){return n===5?0:n*2}
function hurdlePassed(n){
 if(n===5) return storyPuzzles().filter(p=>storyIndex(p)<=5 && store.done[p.id]).length>=5;
 return earnedStoryStarsThrough(n)>=hurdleRequiredStars(n);
}
function hurdleBefore(index){
 let gate=0;
 for(const g of STORY_HURDLES){if(index>g)gate=g;else break}
 return gate;
}
function isStoryUnlocked(p){
 const idx=storyIndex(p);
 if(idx<1||idx>105)return false;
 const gate=hurdleBefore(idx);
 return gate===0||hurdlePassed(gate);
}
function storyGateText(idx){
 const gate=hurdleBefore(idx);
 if(!gate)return '';
 if(gate===5){
   const played=storyPuzzles().filter(p=>storyIndex(p)<=5 && store.done[p.id]).length;
   return `${t('hurdle')} ${gate}: ${played}/5 ${t('tasks')} ${t('completed')}`;
 }
 const have=earnedStoryStarsThrough(gate),need=hurdleRequiredStars(gate);
 return `${t('hurdle')} ${gate}: ${have}/${need} ⭐`;
}
function availableHelpCount(){return store.kid?'∞':Math.max(0,3+Math.floor(totalStoryStars()/10)-(Number(store.helpUsed)||0))}
function renderHeaderStars(){const e=document.getElementById('headerStars');if(e)e.innerHTML=`⭐ <b>${totalStoryStars()}</b>`;const h=document.getElementById('headerHelps');if(h)h.innerHTML=`💡 <b>${availableHelpCount()}</b>`;}
function nextTask(){return storyPuzzles().find(p=>!store.done[p.id]&&isStoryUnlocked(p))}

function hurdleHtml(gate){
 const passed=hurdlePassed(gate);
 if(gate===5){
   const played=storyPuzzles().filter(p=>storyIndex(p)<=5 && store.done[p.id]).length;
   return `<div class="story-hurdle chapter"><b>🛡️ ${t('hurdleLabel')} · ${gate} ${passed?'✓':''}</b><small>${played}/5 ${t('tasks')} ${t('completed')}${passed?' · '+t('unlocked'):''}</small></div>`;
 }

}

const STK_K='#2b2433';
function _o(x){return `stroke="${STK_K}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" ${x||''}`}
function sEl(cx,cy,rx,ry,f,x){return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${f}" ${_o(x)}/>`}
function sCi(cx,cy,r,f,x){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${f}" ${_o(x)}/>`}
function sPa(d,f,x){return `<path d="${d}" fill="${f}" ${_o(x)}/>`}
function sLn(d,x){return `<path d="${d}" fill="none" ${_o(x)}/>`}
function sNo(d,f){return `<path d="${d}" fill="${f}"/>`}   /* ohne Kontur */
function sEye(x,y,r,m){r=r||4.4;const a=m==='mad'?`<path d="M${x-r-1.5} ${y-r-1.2} L${x+r+1.5} ${y-r+1.6}" stroke="${STK_K}" stroke-width="2.4" stroke-linecap="round"/>`:'';
 return `<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" ${_o('stroke-width="1.8"')}/><circle cx="${x+.6}" cy="${y+.5}" r="${r*.6}" fill="${STK_K}"/><circle cx="${x-.7}" cy="${y-1}" r="${r*.22}" fill="#fff"/>`+a}
function sEyes(x1,x2,y,r,m){return sEye(x1,y,r,m)+(m==='mad'?mirrorBrow(x2,y,r):'')+sEye(x2,y,r,m==='mad'?'':m)}
function mirrorBrow(x,y,r){return `<path d="M${x+r+1.5} ${y-r-1.2} L${x-r-1.5} ${y-r+1.6}" stroke="${STK_K}" stroke-width="2.4" stroke-linecap="round"/>`}
function sBlush(x,y,r){return `<ellipse cx="${x}" cy="${y}" rx="${r||4.6}" ry="${(r||4.6)*.66}" fill="#ff7a8a" opacity=".55"/>`}
function sSmile(x,y,w,m){w=w||6;return m==='mad'?`<path d="M${x-w} ${y+1} Q${x} ${y-4} ${x+w} ${y+1}" fill="none" stroke="${STK_K}" stroke-width="2.2" stroke-linecap="round"/>`:`<path d="M${x-w} ${y} Q${x} ${y+w*.9} ${x+w} ${y}" fill="none" stroke="${STK_K}" stroke-width="2.2" stroke-linecap="round"/>`}
function sFang(x,y){return `<path d="M${x-1.6} ${y} L${x} ${y+4.6} L${x+1.6} ${y} Z" fill="#fff" ${_o('stroke-width="1.2"')}/>`}
function sTeeth(x,y,w,n){let s='';const k=w*2/n;for(let i=0;i<n;i++){const a=x-w+i*k;s+=`<path d="M${a} ${y} l${k/2} 4.4 l${k/2} -4.4 z" fill="#fff" ${_o('stroke-width="1"')}/>`}return s}
function sMir(inner){return `<g transform="translate(100 0) scale(-1 1)">${inner}</g>`}
function sRot(inner,a,cx,cy){return `<g transform="rotate(${a} ${cx||50} ${cy||50})">${inner}</g>`}
function sSpots(list,f){return list.map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="${p[2]}" ry="${p[3]||p[2]}" fill="${f}"/>`).join('')}

function stkEnsure(){if(!document.getElementById('stkDefs')){const d=document.createElement('div');d.id='stkDefs';d.setAttribute('aria-hidden','true');d.innerHTML=STK_FILTER;document.body.appendChild(d)}}

 else if(o.snout==='hippo')s+=sEl(50,64,28,18,o.c2)+sEl(40,60,3,3.6,'#5a4a50','stroke="none"')+sEl(60,60,3,3.6,'#5a4a50','stroke="none"');
 else s+=sEl(50,o.my,o.mw,o.mh,o.c2);

 if(o.after)s+=o.after;
 return s}

{const _hb=hurdleBefore,_hp=hurdlePassed,_gt=storyGateText;

 de:{sub:'Das Logik-Stäbchen-Puzzle',age:'ab 8 Jahren',pl:'1 Spieler',min:'10–20 Min.',qrCover:'Die Begleit-App prüft deinen Stand und hilft, wenn du nicht weiterkommst.',qrHelp:'Du kommst nicht weiter? In der App kannst du deinen Stand nachlegen, prüfen lassen und dir Hilfen holen.',page:'Seite',foot:'AlignStix – Das Logik-Stäbchen-Puzzle',
  matT:'Spielmaterial',matP:'Zum Spiel gehören das Brett mit 5 Spalten (senkrecht) und 5 Zeilen (waagerecht) und <b>10 nummerierte Stäbe</b>. Auf jede der 10 Positionen kommt genau ein Stab.',tenT:'Die zehn Stäbe',tenP:'Jeder Stab hat zwei Seiten: <b>Seite A (●)</b> und <b>Seite B (▲)</b>. Die Aussparungen sind auf jeder Seite anders verteilt.',sA:'Seite A (●)',sB:'Seite B (▲)',turn:'<b>Drehen:</b> Enden tauschen. <b>Wenden:</b> andere Seite nach oben. Mit beidem lässt sich jeder Stab in vier Lagen legen.',
  sideT:'Die Stäbe von der Seite',sideP:'So sieht jeder Stab im Querschnitt aus: <b>oben die Kante von Seite A (●)</b>, <b>unten die Kante von Seite B (▲)</b>. Die Einkerbungen sind die Aussparungen. Dort, wo an einer Kreuzung der andere Stab voll ist, greifen die Stäbe ineinander.',sideTip:'Tipp: Hältst du einen echten Stab seitlich vor dich, siehst du dieselben Einkerbungen.',
  ruleT:'Spielregeln',goalT:'Ziel',goalP:'Vervollständige die Aufgabe: Einige Stäbe liegen schon vorgegeben auf dem Brett. Lege die übrigen Stäbe so dazu, dass an <b>jeder Kreuzung</b> alles zusammenpasst. Jede Aufgabe hat genau eine Lösung.',setT:'Aufbau',setP:'Das Brett hat ein 5×5-Raster: 5 senkrechte und 5 waagerechte Positionen. Alle 10 Stäbe werden benutzt, auf jede Position kommt genau ein Stab.',fitT:'Es muss passen',fitP:'An jeder Kreuzung hat <b>ein Stab eine Aussparung und der andere ist voll</b>. Zwei Aussparungen oder zweimal voll passt nicht.',topT:'Oben und unten',topP:'Waagerechte Stäbe liegen immer oben. Bei senkrechten Stäben zählt die <b>sichtbare Oberseite</b>, bei waagerechten die <b>Unterseite</b>.',markT:'Markierungen in den Aufgaben',markP:'Eine Markierung bedeutet: An dieser Stelle hat der Stab eine Aussparung. Ohne Markierung ist er dort voll.',mk1:'<b>Zwei Linien quer zum Stab</b> (großes Quadrat): sichtbare Aussparung auf der Oberseite eines senkrechten Stabs.',mk2:'<b>Kleines Quadrat</b>: Aussparung auf der Unterseite eines waagerechten Stabs.',
  playT:'So spielst du',st1:'<b>Stäbe legen.</b> Lege die vorgegebenen Stäbe auf dein Brett, mit der gezeigten Seite (● oder ▲) und Richtung. Die Nummer am Stabende zeigt, welcher Stab es ist.',st2:'<b>Ergänzen.</b> Lege die übrigen Stäbe so, dass an jeder Kreuzung ein Stab eine Aussparung hat und der andere voll ist.',st3:'<b>Lage ändern.</b> Passt ein Stab nicht, <b>drehe</b> ihn (Enden tauschen) oder <b>wende</b> ihn (andere Seite oben).',st4:'<b>Prüfen.</b> Vergleiche mit dem Lösungsteil hinten oder lass die App prüfen. Die Aufgaben sind nach Schwierigkeit sortiert.',lagen:'Die vier Lagen eines Stabs',ex:'Beispiel: Aufgabe',exT:'Aufgabe: Diese Stäbe sind vorgegeben.',exS:'Lösung: Die schraffierten Stäbe kommen dazu.',
  tasks:'Aufgaben',task:'Aufgabe',solved:'gelöst',warnT:'Erst selbst probieren!',warnP:'Auf den folgenden Seiten stehen die Lösungen.<br>Schraffierte Stäbe sind die, die du in der Aufgabe selbst legen musst. Alle anderen waren schon vorgegeben.',sols:'Lösungen',
  names:{intro:'Einführung',easy:'Einfach',medium:'Mittel',hard:'Schwer',impossible:'Unmöglich'},

 en:{sub:'The Logic Stick Puzzle',age:'ages 8+',pl:'1 player',min:'10–20 min',qrCover:'The companion app checks your layout and helps when you get stuck.',qrHelp:'Stuck? In the app you can copy your layout, have it checked and get hints.',page:'Page',foot:'AlignStix – The Logic Stick Puzzle',
  matT:'Game material',matP:'The game consists of the board with 5 columns (vertical) and 5 rows (horizontal) and <b>10 numbered sticks</b>. Each of the 10 positions takes exactly one stick.',tenT:'The ten sticks',tenP:'Every stick has two sides: <b>side A (●)</b> and <b>side B (▲)</b>. The notches are distributed differently on each side.',sA:'Side A (●)',sB:'Side B (▲)',turn:'<b>Turn:</b> swap the ends. <b>Flip:</b> other side up. With both, every stick can lie in four ways.',
  sideT:'The sticks from the side',sideP:'This is each stick in cross-section: <b>the top edge is side A (●)</b>, <b>the bottom edge is side B (▲)</b>. The cut-outs are the notches. Where the other stick is solid at a crossing, the sticks interlock.',sideTip:'Tip: hold a real stick sideways and you will see the same notches.',
  ruleT:'Rules',goalT:'Goal',goalP:'Complete the task: some sticks are already placed on the board. Add the remaining sticks so that everything fits at <b>every crossing</b>. Every task has exactly one solution.',setT:'Setup',setP:'The board is a 5×5 grid: 5 vertical and 5 horizontal positions. All 10 sticks are used, each position takes exactly one stick.',fitT:'It has to fit',fitP:'At every crossing <b>one stick has a notch and the other is solid</b>. Two notches or two solids do not fit.',topT:'Top and bottom',topP:'Horizontal sticks always lie on top. For vertical sticks the <b>visible top</b> counts, for horizontal ones the <b>underside</b>.',markT:'Markings in the tasks',markP:'A marking means: at this spot the stick has a notch. Without a marking it is solid there.',mk1:'<b>Two lines across the stick</b> (large square): visible notch on the top of a vertical stick.',mk2:'<b>Small square</b>: notch on the underside of a horizontal stick.',
  playT:'How to play',st1:'<b>Place sticks.</b> Put the given sticks on your board, with the shown side (● or ▲) and direction. The number at the end shows which stick it is.',st2:'<b>Complete.</b> Place the remaining sticks so that at every crossing one stick has a notch and the other is solid.',st3:'<b>Change position.</b> If a stick does not fit, <b>turn</b> it (swap ends) or <b>flip</b> it (other side up).',st4:'<b>Check.</b> Compare with the solutions at the back or let the app check. Tasks are sorted by difficulty.',lagen:'The four positions of a stick',ex:'Example: task',exT:'Task: these sticks are given.',exS:'Solution: the hatched sticks are added.',
  tasks:'Tasks',task:'Task',solved:'solved',warnT:'Try it yourself first!',warnP:'The solutions follow on the next pages.<br>Hatched sticks are the ones you have to place yourself. All others were already given.',sols:'Solutions',
  names:{intro:'Introduction',easy:'Easy',medium:'Medium',hard:'Hard',impossible:'Impossible'},
  rowT:'Print guide',rowD:'Printable game guide with all tasks and solutions, in your stick colours',busy:'Preparing guide …'},
 fr:{sub:'Le puzzle logique de bâtons',age:'dès 8 ans',pl:'1 joueur',min:'10–20 min',qrCover:'L’appli compagnon vérifie ta disposition et t’aide quand tu bloques.',qrHelp:'Tu bloques ? Dans l’appli, tu peux reproduire ta disposition, la faire vérifier et obtenir des indices.',page:'Page',foot:'AlignStix – Le puzzle logique de bâtons',
  matT:'Matériel de jeu',matP:'Le jeu se compose du plateau avec 5 colonnes (verticales) et 5 lignes (horizontales) et de <b>10 bâtons numérotés</b>. Chacune des 10 positions reçoit exactement un bâton.',tenT:'Les dix bâtons',tenP:'Chaque bâton a deux faces : la <b>face A (●)</b> et la <b>face B (▲)</b>. Les encoches sont réparties différemment sur chaque face.',sA:'Face A (●)',sB:'Face B (▲)',turn:'<b>Tourner :</b> échanger les extrémités. <b>Retourner :</b> l’autre face vers le haut. Avec les deux, chaque bâton peut se poser de quatre façons.',

const _nav={stack:[],cur:{k:'home',fn:'goHome',a:[]},back:false};
function navDesc(fn,a){const kind={goHome:'home',openStory:'story',openBook:'book',openGuide:'guide',openSettings:'settings',openRods:'rods',openLists:'lists',openPuzzle:'puzzle',openBookPuzzle:'puzzle'}[fn];return {k:kind,fn,a:a||[]}}
function navSame(x,y){return x&&y&&x.fn===y.fn&&JSON.stringify(x.a)===JSON.stringify(y.a)}
function navWrap(fn){const orig=window[fn]||eval(fn);const w=function(){const nd=navDesc(fn,[...arguments]);
  if(fn==='goHome'){if(!_nav.back)_nav.stack=[]}
  else if(!_nav.back&&!navSame(_nav.cur,nd)){
   const c=_nav.cur;
   if(nd.k==='puzzle'&&c.k==='puzzle'){/* Aufgabe -> Aufgabe: ersetzen */}
   else if(nd.k==='puzzle'&&c.k==='home'){_nav.stack.push(c);_nav.stack.push(navDesc(fn==='openBookPuzzle'?'openBook':'openStory'))}
   else if(c.k!==nd.k||nd.k==='lists')_nav.stack.push(c);
  }
  _nav.cur=nd;return orig.apply(this,arguments)};return w}
openGoHomeWrap();
function openGoHomeWrap(){goHome=navWrap('goHome');openStory=navWrap('openStory');openBook=navWrap('openBook');openGuide=navWrap('openGuide');openSettings=navWrap('openSettings');openRods=navWrap('openRods');openLists=navWrap('openLists');openPuzzle=navWrap('openPuzzle');openBookPuzzle=navWrap('openBookPuzzle')}
function navBack(){let d=_nav.stack.pop();while(d&&navSame(d,_nav.cur))d=_nav.stack.pop();
