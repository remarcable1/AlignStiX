<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AlignStix</title>
<meta name="description" content="AlignStix – die App zu deinem Stäbchen-Puzzle">
<meta name="theme-color" content="#EEF2EE">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<style>
:root{
 color-scheme:light;
 --bg:#EEF2EE;--card:#FFFFFF;--card2:#F5F8F5;--ink:#0E1F1A;--ink2:#51635C;--line:#D5DED8;
 --pri:#0B5D4B;--onpri:#FFFFFF;--pric:#CFEBE1;--onpric:#06382C;
 --mat:#0F4F41;--mat2:#0A3D32;--board:#24282b;--bi:255,255,255;--boardline:rgba(255,255,255,.08);--onmat:#EAF6F1;
 --sun:#FFC533;--bad:#C9412D;--badc:#FFE1DA;
 --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.35,.45,1);
 --font:"Google Sans Text","Google Sans",ui-rounded,"SF Pro Rounded","Nunito",Roboto,"Segoe UI",system-ui,sans-serif;
 --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
html.dark{
 color-scheme:dark;
 --bg:#09120F;--card:#13211C;--card2:#192A24;--ink:#E6F0EB;--ink2:#9DB1A8;--line:#263A32;
 --pri:#7ADCC0;--onpri:#06281F;--pric:#173A30;--onpric:#C9F2E4;
 --mat:#0C4135;--mat2:#082E25;--onmat:#E3F3EC;
 --bad:#FF8A75;--badc:#4A1B10;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
html{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--font);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3,p{margin:0}
svg{display:block}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.view{flex:1;padding:calc(var(--safe-t) + 14px) 18px calc(var(--safe-b) + 108px)}
.view.full{padding-bottom:calc(var(--safe-b) + 22px)}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin-bottom:18px}
.wm{color:inherit;display:flex;align-items:center;gap:9px;font-weight:800;font-size:21px;letter-spacing:-.02em}
.wm svg{width:28px;height:28px}
.topr{display:flex;align-items:center;gap:10px}
.starchip{display:flex;align-items:center;gap:5px;font-weight:700;font-size:15px;padding:6px 12px;border-radius:999px;background:var(--card)}
.starchip svg{width:16px;height:16px;color:var(--sun)}
.av{width:44px;height:44px;display:grid;place-items:center;position:relative;flex:none;font-weight:800;font-size:17px}
.av svg{position:absolute;inset:0;width:100%;height:100%}
.av span{position:relative}
.av.t span{transform:translateY(4px)}

/* Start */
.hello{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.sub{color:var(--ink2);margin-top:6px;font-size:16px}
.hero{margin-top:20px;background:var(--hero,var(--mat));color:var(--onhero,var(--onmat));box-shadow:inset 0 0 0 2px rgba(127,127,127,.16);border-radius:32px;padding:16px;display:grid;grid-template-columns:132px 1fr;gap:16px;align-items:center;width:100%;text-align:left;position:relative;overflow:hidden}
.hero .mini{border-radius:20px;overflow:hidden}
.hero h2{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.hero .lvn{font-size:14px;opacity:.8;font-weight:600;margin-bottom:2px}
.hero .go{margin-top:12px;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 18px 0 14px;border-radius:999px;background:var(--sun);color:#221A00;font-weight:800;font-size:15px;white-space:nowrap}
.hero .go svg{width:18px;height:18px}
.hero:active{transform:scale(.985)}
.hero{transition:transform .15s var(--ease)}
.newb{display:flex;align-items:center;gap:12px;width:100%;margin-top:10px;padding:14px 16px;border-radius:22px;background:var(--card);font-weight:700;text-align:left}
.newb span{flex:1}.newb svg{width:22px;height:22px;flex:none}.newb svg:last-child{transform:rotate(180deg);color:var(--ink2)}
.sect{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:28px 2px 12px}
.lvlist{display:flex;flex-direction:column;gap:10px}
.lvcard{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:26px;background:var(--lc);color:var(--lci);text-align:left;width:100%;transition:transform .15s var(--ease)}
.lvcard:active{transform:scale(.98)}
.lvcard .t{flex:1;min-width:0}
.lvcard b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}
.lvcard small{font-size:14px;font-weight:600;opacity:.75}
.lat{display:grid;grid-template-columns:repeat(5,9px);gap:4px;flex:none}
.lat i{width:9px;height:9px;border-radius:3px;background:currentColor;opacity:.18}
.lat i.on{opacity:1;background:var(--ls)}
.lat.row{grid-template-columns:repeat(5,14px)}.lat.row i{width:14px;height:14px;border-radius:5px}
.lvcard.lock{opacity:.6}

/* Stufe */
.tbar{display:flex;align-items:center;gap:8px;min-height:48px;margin-bottom:12px}
.ib{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ib:active{background:var(--line)}
.ib svg{width:24px;height:24px}
.ib.on{background:var(--pric);color:var(--onpric)}
.tbar h1{font-size:22px;font-weight:800;letter-spacing:-.02em;flex:1;min-width:0}
.lvhead{background:var(--lc);color:var(--lci);border-radius:32px;padding:22px 20px;margin-bottom:18px}
.lvhead h2{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.lvhead p{font-weight:600;opacity:.8;margin-top:4px}
.bar{height:10px;border-radius:5px;background:rgba(0,0,0,.12);margin-top:14px;overflow:hidden}
html.dark .bar{background:rgba(255,255,255,.14)}
.bar i{display:block;height:100%;border-radius:5px;background:var(--ls);transition:width .6s var(--ease)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{aspect-ratio:1;border-radius:20px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:800;font-size:19px;position:relative;transition:transform .15s var(--spring)}
.tile:active{transform:scale(.92)}
.tile.done{background:var(--ls);color:var(--lsi)}
.tile.lock{background:transparent;box-shadow:inset 0 0 0 2px var(--line);color:var(--ink2);opacity:.7}
.tile.next{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--ls)}
.pips{display:flex;gap:3px;height:6px}
.pips i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.3}
.pips i.on{opacity:1}

/* Aufgabe */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.steps span{font-size:13px;font-weight:700;color:var(--ink2);padding-top:9px;position:relative;text-align:left}
.steps span::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:3px;background:var(--line)}
.steps span.on{color:var(--ink)}.steps span.on::before{background:var(--pri)}
.steps span.past::before{background:var(--pri);opacity:.45}
.bwrap{position:relative;border-radius:30px;overflow:hidden;background:var(--board)}
.bwrap .xr{position:absolute;right:10px;bottom:10px;width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center}
.bwrap .xr svg{width:22px;height:22px}
.bwrap .xr.on{background:var(--sun);color:#221A00}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--ink2);margin-top:10px;font-weight:600;min-height:20px}
.legend span{display:inline-flex;align-items:center;gap:6px}.legend svg{width:30px;height:18px;flex:none}
.panel{margin-top:16px}
.panel h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.panel>p{color:var(--ink2);margin-top:4px}
.slist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.srow{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:20px;background:var(--card);text-align:left;width:100%;transition:background .15s,transform .15s var(--ease)}
.srow.big{padding:14px 16px 14px 14px;border-radius:24px}.srow.big .chip{min-width:56px;height:56px;border-radius:18px;font-size:24px}.srow.big b{font-size:18px}.srow.big small{font-size:15px}
.srow b{display:block;font-weight:700;font-size:16px}
.srow small{color:var(--ink2);font-size:14px;font-weight:500}
.chip{min-width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:800;font-size:19px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.14)}
html.dark .chip{box-shadow:inset 0 0 0 2px rgba(255,255,255,.22)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tray .chip{transition:transform .15s var(--spring)}.tray .chip:active{transform:scale(.9)}
.lbl{font-size:14px;font-weight:700;color:var(--ink2);margin-top:16px}
.cta{display:flex;gap:10px;margin-top:20px}
.cta.col{flex-direction:column;gap:6px}.cta.col .btn{flex:none;width:100%}
.stack .btn{flex:none}
.sc .slist .srow{background:var(--card2)}
.btn{height:56px;border-radius:999px;padding:0 24px;font-weight:800;font-size:17px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--spring),background .15s;white-space:nowrap}
.btn:active{transform:scale(.96)}
.btn svg{width:20px;height:20px}
.btn.pri{background:var(--pri);color:var(--onpri)}
.cta:not(.col) .btn.pri{flex:1}
.btn.ton{background:var(--pric);color:var(--onpric)}
.btn.txt{color:var(--pri);padding:0 14px}
.btn.wide{width:100%}
.btn.bad{background:var(--badc);color:var(--bad)}
.banner{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em}
.sstars{display:inline-flex;gap:3px}
.sstars svg{width:22px;height:22px;color:var(--line)}
.sstars svg.on{color:var(--sun)}

/* Brett */
.board{width:100%;height:auto;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.board text{font-family:var(--font);font-weight:800;text-anchor:middle;dominant-baseline:central}
.slot rect{fill:rgba(var(--bi),.05);stroke:rgba(var(--bi),.3);stroke-width:2;stroke-dasharray:7 7}
.stk .body{stroke:rgba(var(--bi),.32)}
.board .ix{fill:rgba(var(--bi),.55);font-size:17px;font-weight:700}
.board .ix.on{fill:var(--sun)}
.slot.tap{cursor:pointer}
.slot.hl rect{stroke:var(--sun);stroke-width:5;stroke-dasharray:none;fill:rgba(255,197,51,.16);animation:pulse 1.2s ease-in-out infinite}
.stk{pointer-events:none}
.stk .veil{display:none}
.stk .ring{fill:none;stroke:var(--sun);stroke-width:6;opacity:0}
.stk.hl .ring{opacity:1;animation:pulse 1.2s ease-in-out infinite}
.real .stk.H .un{display:none}
.stk.help1 .body{opacity:.55}
.stk{transform-box:fill-box;transform-origin:center}
.stk.in{animation:drop .44s both;animation-delay:var(--d,0ms)}
.stk.in .sh{animation:dropSh .44s both;animation-delay:var(--d,0ms)}
@keyframes drop{0%{opacity:0;transform:translateY(-10px) scale(1.17);animation-timing-function:cubic-bezier(.55,0,.9,.55)}18%{opacity:1}66%{transform:scale(1);animation-timing-function:cubic-bezier(.2,.7,.4,1)}80%{transform:translateY(-1.5px) scale(1.014);animation-timing-function:cubic-bezier(.5,0,.8,.5)}100%{opacity:1;transform:none}}
@keyframes dropSh{0%{opacity:0;transform:translate(0,40px);animation-timing-function:cubic-bezier(.55,0,.9,.55)}66%{opacity:1;transform:translate(0,6px)}80%{transform:translate(0,9px)}100%{opacity:1;transform:translate(0,6px)}}
@keyframes pulse{50%{opacity:.45}}

/* Stäbe */
.pagehead h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.025em}
.pagehead p{color:var(--ink2);margin-top:8px}
.rodlist{display:flex;flex-direction:column;gap:10px;margin-top:20px}
.rodcard{background:var(--card);border-radius:24px;padding:12px 8px 10px 14px}
.rodcard .meta{display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:15px;margin-bottom:6px}
.rodcard .meta span{color:var(--ink2);font-weight:600}
.rodcard .meta .ib{width:40px;height:40px}.rodcard .meta .ib svg{width:20px;height:20px}
.flipw{display:block;width:100%;container-type:inline-size;perspective:1200px;padding:6px 8px;touch-action:pan-y}
.flipw.turning{position:relative;z-index:5}
.lift,.turn,.roll{display:block;transform-style:preserve-3d}
.lift.go .roll{animation:roll .85s cubic-bezier(.4,0,.3,1)}
@keyframes roll{0%,100%{transform:none}28%,66%{transform:rotateX(-34deg)}}
.turn{transform:rotateZ(var(--tz,0deg));transition:transform .85s cubic-bezier(.5,0,.2,1.1)}
.lift.go{animation:lift .85s cubic-bezier(.4,0,.3,1)}
@keyframes lift{0%,100%{transform:none}28%,66%{transform:rotateX(50deg) scale(.62)}}
.flip .lab{transform-box:fill-box;transform-origin:center;transition:transform .85s cubic-bezier(.5,0,.2,1.1)}
.flip .fa .lab{transform:rotate(calc(var(--tz,0deg) * -1))}
.flip .fb .lab{transform:rotate(var(--tz,0deg))}
.flip{display:block;position:relative;height:10.9375cqw;transform-style:preserve-3d;transition:transform .6s var(--spring)}
.flip .f{position:absolute;inset:0;display:block;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .f svg{width:100%;height:100%}
.flip .fa{transform:translateZ(5.46875cqw)}
.flip .fb{transform:rotateX(180deg) translateZ(5.46875cqw)}
.flip .ft{transform:rotateX(90deg) translateZ(5.46875cqw)}
.flip .fd{transform:rotateX(-90deg) translateZ(5.46875cqw)}
.flip .e{position:absolute;top:0;width:10.9375cqw;height:100%;border-radius:3px}
.flip .nf{position:absolute;top:0;height:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .nf.s0{transform:translateZ(1.8229cqw)}
.flip .nf.s1{transform:rotateX(180deg) translateZ(1.8229cqw)}
.flip .nw{position:absolute;top:0;height:100%;width:2.8cqw;margin-left:-1.4cqw;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip .nw.s0.l{transform:translateZ(3.17cqw) rotateY(90deg)}
.flip .nw.s0.r{transform:translateZ(3.17cqw) rotateY(-90deg)}
.flip .nw.s1.l{transform:translateZ(-3.17cqw) rotateY(90deg)}
.flip .nw.s1.r{transform:translateZ(-3.17cqw) rotateY(-90deg)}
.flip .el{left:-5.46875cqw;transform:rotateY(-90deg)}
.flip .er{right:-5.46875cqw;transform:rotateY(90deg)}
.flip text{font-family:var(--font);font-weight:800;text-anchor:middle;dominant-baseline:central}

/* Regeln */
.rule{background:var(--card);border-radius:28px;padding:18px;margin-top:14px}
.rule h2{font-size:21px;font-weight:800;letter-spacing:-.015em}
.rule p{color:var(--ink2);margin-top:6px}
.rule .ill{margin-top:14px;border-radius:20px;overflow:hidden}
.rule .ill.mat{background:var(--board);max-width:260px}
.rule .hint{font-size:13px;font-weight:700;color:var(--ink2);margin-top:8px}
.fits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.fit{background:var(--card2);border-radius:16px;padding:8px 4px 8px;text-align:center;font-size:12px;font-weight:700}
.fit.ok{color:var(--pri)}.fit.no{color:var(--bad)}
.fit svg{width:100%;height:auto}
.fit{display:flex;flex-direction:column;align-items:center;gap:2px}
.fits{grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:700px){.fits{grid-template-columns:repeat(4,1fr)}}
.fit{padding:12px 8px 10px;font-size:14px}
.fit svg{max-width:150px}
.fit img.fx{width:100%;max-width:190px;height:auto;display:block}
.fit .fk{display:block;color:var(--ink2);font-weight:600;font-size:13px;line-height:1.3;min-height:0;margin-top:4px;padding:0 2px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.flow div{background:var(--pric);color:var(--onpric);border-radius:16px;padding:12px 8px;text-align:center;font-weight:800;font-size:14px}
.flow svg{width:26px;height:26px;margin:0 auto 6px}

/* Navigation */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);padding:8px 12px calc(var(--safe-b) + 10px);display:flex;justify-content:center}
.nav .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:496px}
.nav button{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--ink2);padding:4px 0}
.nav button i{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .25s var(--ease),transform .25s var(--spring)}
.nav button svg{width:24px;height:24px}
.nav button.on{color:var(--ink)}
.nav button.on i{background:var(--pric);color:var(--onpric)}
.nav button:active i{transform:scale(.9)}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50;pointer-events:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(4,12,9,.55);opacity:0;transition:opacity .25s}
#sheet .sc{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border-radius:32px 32px 0 0;padding:10px 20px calc(var(--safe-b) + 22px);transform:translateY(105%);transition:transform .38s var(--ease),min-height .3s var(--ease),max-height .3s var(--ease);min-height:0;max-height:78vh;overflow:auto;overscroll-behavior:contain}
#sheet.open{pointer-events:auto}
#sheet.open .scrim{opacity:1}
#sheet.open .sc{transform:none}
.grabz{touch-action:none;cursor:grab;margin:-10px -20px 0;padding:12px 0 16px;position:sticky;top:-10px;background:var(--card);z-index:3;border-radius:32px 32px 0 0}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
.sc.full{min-height:calc(100dvh - 36px);max-height:calc(100dvh - 36px)!important}
.sc h2{font-size:22px;font-weight:800;letter-spacing:-.02em}
.sc>p{color:var(--ink2);margin-top:6px}
.sc .stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.note{font-size:14px;color:var(--ink2);font-weight:600}
.qchips{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.qchips .chip{min-width:60px;height:60px;border-radius:20px;font-size:24px;transition:transform .15s var(--spring)}
.qchips .chip:active{transform:scale(.9)}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.plist{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:20px;width:100%;text-align:left;font-weight:700}
.prow.on{background:var(--pric);color:var(--onpric)}
.prow small{display:block;font-weight:600;font-size:13px;opacity:.75}
.prow .x{margin-left:auto}
.field{display:flex;gap:8px;margin-top:10px}
.field input{flex:1;min-width:0;height:52px;border-radius:16px;border:2px solid var(--line);background:var(--card2);color:var(--ink);padding:0 16px;font:600 17px var(--font)}
.field input::placeholder{color:var(--ink2);opacity:.7}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-weight:700}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:4px}
.seg button{height:38px;padding:0 13px;border-radius:999px;font-weight:700;font-size:14px;color:var(--ink2)}
.seg button.on{background:var(--pri);color:var(--onpri)}
.swatches{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:18px}
.swatches button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
html.dark .swatches button{box-shadow:inset 0 0 0 2px rgba(255,255,255,.25)}
.swatches button.on{outline:3px solid var(--ink);outline-offset:3px}
.shapes{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.shapes button{border-radius:18px;padding:5px}
.shapes button.on{background:var(--pric)}

/* Willkommen */

 #app{max-width:1200px}
 #app:has(>.nav){padding-left:104px}
 .nav{top:0;bottom:0;left:0;right:auto;width:104px;padding:0;flex-direction:column;justify-content:center;box-shadow:1px 0 0 rgba(127,127,127,.16)}
 .nav .in{grid-template-columns:1fr;gap:22px;max-width:none}
 .view{padding:34px 44px 48px}
 .view.home{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:44px;align-content:start;grid-template-areas:"top top" "a b" "r b"}
 .view.home>.top{grid-area:top}.ha{grid-area:a}.hb{grid-area:b}.hr{grid-area:r}
 .hb .sect{margin-top:4px}
 .lvlist{grid-template-columns:1fr}
 .lvlist .lvcard{padding:18px 20px}
 .rank{grid-template-columns:1fr}
 .rodlist{grid-template-columns:1fr 1fr}
 .view.rules{max-width:1040px;margin:0 auto;width:100%}
 /* Aufgabe: Brett links, alles andere rechts */
 .view.task{display:grid;grid-template-columns:minmax(0,1fr) 420px;column-gap:52px;grid-template-rows:auto auto auto auto 1fr;align-content:start;min-height:100dvh;padding:28px 44px}
 .view.task>*{grid-column:2;max-width:none;margin-left:0;margin-right:0}
 .view.task>.bbox{grid-column:1;grid-row:1/span 5;margin-top:0;min-height:0;position:sticky;top:28px;height:calc(100dvh - 56px);align-self:start}
 .bbox .bwrap{width:min(100cqw,100cqh,820px)}
 .task .legend{justify-content:flex-start}
 .task .panel{align-self:end}
 /* Fenster schweben unten in der Mitte */
 #sheet .sc{bottom:24px;border-radius:32px;transform:translateY(calc(100% + 48px))}
 #sheet .sc.full{min-height:0!important;max-height:calc(100dvh - 72px)!important}
}
@media (min-width:1360px){.rodlist{grid-template-columns:1fr 1fr 1fr}}
@media (min-width:1000px) and (max-width:1279px){.hero{grid-template-columns:150px 1fr;gap:18px;padding:18px}.hero h2{font-size:28px}.hero .go{height:46px;font-size:15px;padding:0 16px 0 12px}}
@media (hover:hover) and (pointer:fine){
 .lvcard:hover,.hero:hover,.newb:hover,.tile:not(.lock):hover{transform:translateY(-2px)}
 .btn:hover{filter:brightness(1.06)}
 .nav button:hover i{background:var(--pric);color:var(--onpric)}
}

/* Explosionsansicht: echtes Brett in 3D, untere Stäbe heben ab, die obere Lage klappt hinten auf wie ein Deckel */
.bwrap{transition:background-color .5s ease}
.task .bwrap{perspective:2600px}
.task #bd{container-type:inline-size;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.task .fly{transition:transform .9s cubic-bezier(.45,0,.2,1)}
.b3m{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;transform-style:preserve-3d}
.b3m i{position:absolute;display:block}
.task .board{transition:opacity .3s ease}
.bwrap.b3d{overflow:visible;background-color:transparent}
.bwrap.b3d #bd{transform-style:preserve-3d;pointer-events:none}
.bwrap.b3d #bd .board .stk[data-r]{visibility:hidden}

.bwrap.b3d .fly,.bwrap.b3d .fly .flb,.bwrap.b3d .fly .flipw{transform-style:preserve-3d}
.bwrap.b3d .fly .flipw{perspective:none}
.bwrap.b3d .fly .flsh{visibility:hidden}
.bwrap.boom .fly.drop3 .flb{animation:drop3 .44s both;animation-delay:var(--d,0ms)}
@keyframes drop3{0%{transform:translateZ(34cqw);animation-timing-function:cubic-bezier(.55,0,.9,.55)}66%{transform:translateZ(0);animation-timing-function:cubic-bezier(.2,.7,.4,1)}80%{transform:translateZ(1.6cqw);animation-timing-function:cubic-bezier(.5,0,.8,.5)}100%{transform:none}}
.fly.landed,.fly.landed .flb,.fly.landed .lift,.fly.landed .flip,.fly.landed .flsh{animation:none}
.task .fly.h{transform-origin:50% 50%}
.bwrap.boom{--rx:50deg;--rz:-22deg}
.bwrap.boom #bd{transform:translateY(3%) rotateX(var(--rx)) rotateZ(var(--rz)) scale(.7)}
.bwrap.boom .fly.h{pointer-events:auto;cursor:ns-resize;touch-action:none}
.bwrap.boom .fly.drag{transition:none}
.bwrap.boom .fly.h.pop{transition:transform 1.1s cubic-bezier(.34,1.5,.5,1)}
.boomh{display:inline-flex;align-items:center;gap:6px;margin-left:12px;font-size:13px;opacity:.7}
.boomh svg{width:18px;height:18px}
.bwrap.b3d .board{opacity:0;transform:translateZ(-16cqw)}
.bwrap.b3d .b3m{opacity:1;transition:none}
.b3m{transition-delay:.3s}
/* beim Zurückklappen: obere Stäbe sicher über den unteren, sonst schneiden sie sich in der flachen Ansicht */
.bwrap.snap .fly{transition:none!important}
.bwrap.b3d:not(.boom) .fly.v{transform:translateZ(-4.7cqw)}
.bwrap.b3d:not(.boom) .fly.h{transform:translateZ(4.7cqw)}
.bwrap.boom .fly.v{transform:translateZ(calc(var(--lz,0cqw) - 7.3889cqw))}
.bwrap.boom .fly.h{transform:translateZ(calc(var(--lz,20cqw) - 1.1667cqw))}
.bwrap.boom .fly.h.tilt{transform:translateZ(calc(var(--lz,20cqw) - 1.1667cqw)) rotateX(calc(var(--tilt,115deg) * var(--tf,1)))}
.boomb{display:inline-flex;align-items:center;gap:8px;padding:8px 16px 8px 12px;border-radius:999px;background:var(--card,rgba(127,127,127,.12));color:var(--ink);font:inherit;font-weight:700;font-size:14px;border:1.5px solid rgba(127,127,127,.25)}
.boomb svg{width:20px;height:20px}
.boomb.on{background:var(--sun);color:#221A00;border-color:transparent}
/* Hilfslinien zu den Reihen */
.gd,.gb{position:absolute;display:block;width:.8cqw;margin-left:-.4cqw;opacity:0;transition:opacity .3s ease;pointer-events:none;background:repeating-linear-gradient(to bottom,var(--c) 0 1.4cqw,transparent 1.4cqw 2.2cqw);filter:none}
.gd{transform:translateZ(-4.6cqw)}
.gb{transform:translateZ(.2cqw)}
.gd.hz,.gb.hz{height:.8cqw;margin:-.4cqw 0 0;background:var(--c)}
.gb.hz::after{content:"";position:absolute;right:-2.4cqw;top:-1.6cqw;border:2cqw solid transparent;border-left:2.6cqw solid var(--c);border-right:0}
.gb.hz.rt::after{right:auto;left:-2.4cqw;border-left:0;border-right:2.6cqw solid var(--c)}
.gd,.gb{outline:.12cqw solid rgba(0,0,0,.25);outline-offset:0}
.gz{position:absolute;display:block;width:1cqw;height:calc(var(--lz,20cqw) - .3cqw);margin-left:-.5cqw;opacity:0;transition:opacity .3s,height 1.1s cubic-bezier(.34,1.5,.5,1);pointer-events:none;transform-origin:50% 0;transform:translateZ(-5.73cqw) rotateX(90deg);background:repeating-linear-gradient(to bottom,transparent 0 3cqw,var(--c) 3cqw 4.4cqw,transparent 4.4cqw 5.2cqw)}
.gz::after{content:"";position:absolute;left:-1.9cqw;top:0;border:2.4cqw solid transparent;border-top:0;border-bottom:3.2cqw solid var(--c)}
.bwrap.boom .gz{opacity:.95;transition-delay:.75s}
@media (prefers-reduced-motion:reduce){.task #bd,.task .fly,.b3m,.task .board{transition:none}}

/* Stäbe: Seitenansicht */
.svrow{display:flex;justify-content:flex-start;margin:14px 0 4px}
.flipw .lift{transition:rotate .7s cubic-bezier(.4,0,.2,1.15)}
.flipw.side .lift{rotate:x -82deg}
.flipw{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
@media (prefers-reduced-motion:reduce){.flipw .lift{transition:none}}

/* Regeln: 3D-Vorführung */
.rule .ill.demo3{overflow:visible;max-width:420px;margin-left:auto;margin-right:auto}
.demo3 .bwrap{perspective:2600px;aspect-ratio:1;width:100%}
.demo3 .board{transition:opacity .3s ease}
.demo3 .bdx{position:relative;container-type:inline-size;transition:transform .9s cubic-bezier(.45,0,.2,1)}
.demo3 .bwrap.b3d .bdx{transform-style:preserve-3d;pointer-events:none}
.demo3 .bwrap.boom .bdx{transform:translateY(3%) rotateX(50deg) rotateZ(-22deg) scale(.7)}
.demo3w .legend{display:flex;justify-content:center;margin-top:12px}
.demo3w .hint{text-align:center}
.demo3 .bdx .board .stk[data-r]{visibility:hidden}
.demo3 .fly{transition:transform .9s cubic-bezier(.45,0,.2,1)}
.demo3 .fly.h{transform-origin:50% 50%}
/* Hinweise auf neue Funktionen */
.nbadge{display:inline-block;padding:2px 8px;border-radius:999px;background:var(--sun);color:#221A00;font-size:12px;font-weight:800;line-height:1.4;vertical-align:middle}
.boomb .nbadge{margin-left:2px}
.boomb.on .nbadge{background:#221A00;color:var(--sun)}
.newb.feat .nbadge{flex:none;align-self:center}
.tipnew{display:flex;gap:10px;align-items:center;margin-top:12px;padding:12px 14px;border-radius:16px;background:var(--card,rgba(127,127,127,.12));font-size:15px}
.tipnew .nbadge{flex:none}

/* Kreuzungs-Skizzen: oberer Stab fällt auf den unteren */
.fit svg.fx .up{transform:translateY(calc(var(--g) * -1));animation:fxDrop 3.2s cubic-bezier(.5,0,.5,1) infinite}
.fit svg.fx .gp{opacity:0;animation:fxGap 3.2s infinite}
.fit svg.fx .lv{opacity:.85}
@keyframes fxDrop{0%,18%{transform:translateY(calc(var(--g) * -1))}40%,82%{transform:translateY(0)}100%{transform:translateY(calc(var(--g) * -1))}}
@keyframes fxGap{0%,40%{opacity:0}48%,80%{opacity:.85}90%,100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fit svg.fx .up{animation:none;transform:none}.fit svg.fx .gp{animation:none;opacity:.85}}

/* Kreuzung mit echten Stäben (Regeln und Druck) */
.xw{position:relative;width:100%;aspect-ratio:1;overflow:hidden;border-radius:12px;container-type:inline-size}
.xw{background:color-mix(in srgb,var(--ink) 6%,transparent)}
.xw .bwrap{position:absolute;left:50%;top:50%;width:230cqw;aspect-ratio:1;margin:-115cqw 0 0 -115cqw;perspective:1400px;border-radius:0}
.xw .bdx{position:relative;container-type:inline-size;transform-style:preserve-3d;transform:translateY(-4%) rotateX(68deg) rotateZ(-36deg)}
.xw .bdx .board .stk[data-r]{visibility:hidden}
.xw .fly.h{transform-origin:50% 50%}
.xw .gz{display:none}
.fit .xw svg{max-width:none}
.xw .fly.h.stay{animation:xDrop 3.4s cubic-bezier(.5,0,.4,1) infinite;transform:translateZ(calc(var(--zl) + 6cqw - 1.1667cqw))}
@keyframes xDrop{0%,16%{transform:translateZ(calc(var(--zl) + 6cqw - 1.1667cqw))}42%,80%{transform:translateZ(calc(var(--zl) - 1.1667cqw))}100%{transform:translateZ(calc(var(--zl) + 6cqw - 1.1667cqw))}}
@media (prefers-reduced-motion:reduce){.xw .fly.h.stay{animation:none}}
#print .xw .fly.h.stay{animation:none}

/* Prüfen: Brett über dem Fenster sichtbar halten */
.task .bwrap{transition:transform .38s cubic-bezier(.2,.8,.2,1),background-color .5s ease}
.task .bwrap.peek{position:relative;z-index:51;pointer-events:none;box-shadow:0 10px 40px rgba(0,0,0,.35)}
@media (prefers-reduced-motion:reduce){.task .bwrap{transition:none}}

/* Unteren Stab unter liegende obere Stäbe schieben */
.fly.v.slide .flb{animation:vSlide .75s cubic-bezier(.3,.75,.3,1) both!important;animation-delay:calc(var(--d,0ms) + 260ms)!important}
.fly.v.slide .lift,.fly.v.slide .flip{animation:none!important}
.fly.v.slide .flsh{visibility:hidden}
@keyframes vSlide{0%{transform:translateY(-62cqw);opacity:0}22%{opacity:1}100%{transform:none;opacity:1}}
.fly.h.hup{z-index:4;animation:hLift var(--hd,1300ms) cubic-bezier(.4,0,.2,1) var(--hs,0ms) both!important}
.fly.h.hup .flsh{animation:hLiftSh var(--hd,1300ms) cubic-bezier(.4,0,.2,1) var(--hs,0ms) both!important}
@keyframes hLift{0%{scale:1}16%,80%{scale:1.1}100%{scale:1}}
@keyframes hLiftSh{0%{translate:0 0}16%,80%{translate:0 2.6cqw}100%{translate:0 0}}
.bwrap.b3d .fly.h.hup{animation-name:hLift3}
@keyframes hLift3{0%{translate:0 0 0}16%,80%{translate:0 0 9cqw}100%{translate:0 0 0}}

/* Erster Hinweis auf die 3D-Ansicht */
.bhint{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;margin-top:6px;padding:8px 6px 8px 14px;border-radius:14px;background:color-mix(in srgb,var(--sun) 22%,transparent);color:var(--ink);font-size:13.5px;font-weight:600;line-height:1.35;text-align:left}
.bhint .ib{flex:none;width:32px;height:32px}
.bhint .ib svg{width:16px;height:16px}
.lnks{display:flex;gap:16px}

a.newb,a.btn{color:var(--ink);text-decoration:none}
a.newb span,a.newb small{text-decoration:none}

.pfmt{margin-top:16px}.pfmt .seg{display:flex;width:100%}.pfmt .seg button{flex:1;white-space:nowrap}

/* Druck: keine Animationen, sonst druckt z. B. Android das Logo im unsichtbaren Startzustand */
#print *,#print *::before,#print *::after{animation:none!important;transition:none!important}

function fitIMG(kind){return `<img class="fx" src="${FITIMG[kind]}" alt="" width="720" height="600">`}
function fitSVG(kind){/* echte Stäbe, auf drei Kreuzungsplätze zugeschnitten, in der Schrägansicht der 3D-Ansicht; Maße wie im Druck (13 mm, Kerbe 1/3) */
 const lN=kind==='lo'||kind==='both',uN=kind==='up'||kind==='both';
 const Vs=xPick('V',lN?1:0),Hs=xPick('H',uN?1:0,Vs.rod),pv=pat(Vs.rod,Vs.side,0),ph=pat(Hs.rod,Hs.side,0),lo=colorOf(Vs.rod),up=colorOf(Hs.rod);
 const T=13,D=T/3,NL=13.8,R=23,S=R*1.42,G=24,ub=kind==='none'?T:T-D;
 const az=-38*Math.PI/180,el=46*Math.PI/180,PP=420,ca=Math.cos(az),sa=Math.sin(az),ce=Math.cos(el),se=Math.sin(el);
 const prj=(x,y,z)=>{let X=x,Y=-y,Z=z;const x1=X*ca-Y*sa,y1=X*sa+Y*ca;const y2=y1*ce-Z*se,z2=y1*se+Z*ce;const f=PP/(PP-z2);return [x1*f*2.2,y2*f*2.2,z2]};
 const rotN=(nx,ny,nz)=>{let X=nx,Y=-ny,Z=nz;const x1=X*ca-Y*sa,y1=X*sa+Y*ca;return y1*se+Z*ce};
 const segs=(p,bit)=>{const cut=[];for(let j=-1;j<=1;j++)if(p[2+j]==='1')cut.push([j*R-NL/2,j*R+NL/2]);const out=[];let a=-S;cut.forEach(([c0,c1])=>{out.push([a,c0,0]);out.push([c0,c1,1]);a=c1});out.push([a,S,0]);return out.filter(q=>q[1]>q[0])};
 const mix=(c,k)=>{const v=[1,3,5].map(i=>parseInt(c.slice(i,i+2),16));return '#'+v.map(x=>('0'+Math.round(k>=0?x+(255-x)*k:x*(1+k)).toString(16)).slice(-2)).join('')};
 const LD=(()=>{const v=[-.35,-.55,.78],n=Math.hypot(...v);return v.map(x=>x/n)})();
 const tone=(c,nx,ny,nz)=>{const d=nx*LD[0]+ny*LD[1]+nz*LD[2];return mix(c,d>0?d*.22-.04:d*.42-.06)};
 const rr=(u0,u1,v0,v1,r)=>{const P=[],N=5;[[u1-r,v1-r,0],[u0+r,v1-r,90],[u0+r,v0+r,180],[u1-r,v0+r,270]].forEach(([cu,cv,a0])=>{for(let k=0;k<=N;k++){const a=(a0+90*k/N)*Math.PI/180;P.push([cu+r*Math.cos(a),cv+r*Math.sin(a),Math.cos(a),Math.sin(a)])}});return P};
 const faces=[];
 const ext=(ax,prof,a,b,c,g)=>{const W=(u,v,t)=>ax==='y'?[u,t,v]:[t,u,v],NV=(nu,nv,nt)=>ax==='y'?[nu,nt,nv]:[nt,nu,nv];
  const add=(pts,n,col)=>{if(rotN(...n)<=.01)return;const P=pts.map(q=>prj(...q));faces.push({P,col,g,dz:P.reduce((s,v)=>s+v[2],0)/P.length})};
  for(let k=0;k<prof.length;k++){const p0=prof[k],p1=prof[(k+1)%prof.length],nu=(p0[2]+p1[2])/2,nv=(p0[3]+p1[3])/2,n=NV(nu,nv,0);add([W(p0[0],p0[1],a),W(p1[0],p1[1],a),W(p1[0],p1[1],b),W(p0[0],p0[1],b)],n,tone(c,...n))}
  [[a,-1],[b,1]].forEach(([t,sg])=>{const n=NV(0,0,sg);add(prof.map(q=>W(q[0],q[1],t)),n,tone(c,...n))})};
 const RD=1.8;
 segs(pv).forEach(([a,b,n])=>ext('y',rr(-T/2,T/2,0,n?T-D:T,RD),a,b,lo,0));
 segs(ph).forEach(([a,b,n])=>ext('x',rr(-T/2,T/2,n?ub+D:ub,ub+T,RD),a,b,up,1));
 faces.sort((p,q)=>(p.g-q.g)||(p.dz-q.dz));
 const lift=prj(0,0,G)[1]-prj(0,0,0)[1];
 const poly=f=>`<polygon points="${f.P.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ')}" fill="${f.col}" stroke="${f.col}" stroke-width=".5" stroke-linejoin="round"/>`;
 let h='',ug='';faces.forEach(f=>{if(f.g)ug+=poly(f);else h+=poly(f)});
 let gap='';if(kind==='both'){const q=[[-T/2,-T/2,T-D],[T/2,-T/2,T-D],[T/2,-T/2,T],[-T/2,-T/2,T]].map(v=>prj(...v));gap=`<polygon class="gp" points="${q.map(v=>v[0].toFixed(1)+','+v[1].toFixed(1)).join(' ')}" fill="var(--bad)"/>`}
 const all=faces.flatMap(f=>f.P);const mx=Math.min(...all.map(v=>v[0]))-4,Mx=Math.max(...all.map(v=>v[0]))+4,my=Math.min(...all.map(v=>v[1]))+lift-4,My=Math.max(...all.map(v=>v[1]))+4;
 return `<svg class="fx ${kind}" viewBox="${mx.toFixed(1)} ${my.toFixed(1)} ${(Mx-mx).toFixed(1)} ${(My-my).toFixed(1)}" style="--g:${(-lift).toFixed(1)}px" aria-hidden="true">${h}${gap}<g class="up" transform="translate(0 ${lift.toFixed(1)})">${ug}</g></svg>`}
function viewRules(){const x=TASKS[0];
 return `<main class="view rules">${topBar()}<div class="pagehead"><h1>${t('rulesH')}</h1></div>
 <section class="rule" id="r3d"><h2>${t('r1h')}</h2><p>${t('r1p')}</p><div class="demo3w"><div class="ill demo3"><div class="bwrap"><div class="bdx">${boardSVG({sticks:x.sol.map(s=>({s,kind:'given'}))})}${board3d()}</div></div></div><div class="legend">${boomBtn(false)}</div><p style="margin-top:14px">${t('r5p')}</p><div class="hint">${t('boomDrag')}</div></div></section>

 ${MW_URL?`<a class="newb" style="margin-top:14px" href="${esc(MW_URL)}" target="_blank" rel="noopener">${ic('sticks')}<span>${t('mwH')}<small style="display:block;font-weight:500;color:var(--ink2);font-size:14px">${t('mwP')}</small></span>${ic('back')}</a>`:''}

		throw new Error(num.length + "/" + shift);
	}

		offset++;
	}

	this.num = new Array(num.length - offset + shift);
	for (var i = 0; i < num.length - offset; i++) {
		this.num[i] = num[i + offset];
	}

		return this.num.length;

		var num = new Array(this.getLength() + e.getLength() - 1);

.task{display:grid;grid-template-columns:1fr 15mm;gap:3.500mm;align-items:stretch;min-height:0}
.task .bw{align-self:center}
.task .side{display:flex;flex-direction:column;align-items:center;padding:1mm 0}
.task .no{font-size:21pt;font-weight:800;letter-spacing:-.03em;line-height:1}
.task .rl{font-size:7pt;font-weight:700;color:#51635C;margin-top:4mm;margin-bottom:1.500mm}
.chips{display:flex;flex-direction:column;gap:1.400mm;align-items:center}
.chipp{width:7.400mm;height:7.400mm;border-radius:2mm;display:grid;place-items:center;font-size:9.500pt;font-weight:800;box-shadow:inset 0 0 0 .300mm rgba(0,0,0,.35)}
.chips.many{display:grid;grid-template-columns:6.600mm 6.600mm;gap:1.200mm}.chips.many .chipp{width:6.600mm;height:6.600mm;font-size:8.500pt;border-radius:1.800mm}
.tick{margin-top:auto;width:8mm;height:8mm;border-radius:50%;border:.500mm solid #9DB1A8}
.btile{border-radius:6mm;padding:8mm;display:flex;flex-direction:column;background:var(--lc);color:var(--lci)}
.btile h2{font-size:27pt;letter-spacing:-.03em}
.btile .rg{font-weight:700;font-size:11pt;margin-top:1.500mm;opacity:.85}
.btile .one{font-size:9pt;font-weight:600;opacity:.8;margin-top:auto}
.lat{display:grid;grid-template-columns:repeat(5,6mm);gap:2.400mm;margin-top:7mm}
.lat i{width:6mm;height:6mm;border-radius:1.800mm;background:currentColor;opacity:.16}
.lat i.on{background:var(--ls);opacity:1}
/* Lösungen */
.sh1{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:5mm}
.sh1 h1{font-size:22pt}
.solkey{display:block;font-weight:500;font-size:8.500pt;margin-top:.500mm}
.solc .stk.given .veil{display:block;fill:#fff;fill-opacity:.55}
.solc .stk.sol .body{stroke:#0E1F1A;stroke-width:3.500}
.grid12{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(4,1fr);gap:4mm 8mm;height:254mm}
.solc{display:flex;flex-direction:column;align-items:center;min-height:0}
.solc b{align-self:flex-start;font-size:11pt;font-weight:800;display:flex;align-items:center;gap:1.600mm;margin-bottom:1mm}
.solc b i{width:2.600mm;height:2.600mm;border-radius:50%}
.solc .bw{width:52mm}
/* Rückseite */
.back{background:var(--cv,#0F4F41);color:var(--cvi,#EAF6F1);display:flex;flex-direction:column;justify-content:flex-end;padding:22mm}
.back h1{color:var(--cvh,#fff);font-size:32pt}
.back p{font-size:13pt;margin-top:4mm;max-width:120mm;opacity:.92}
.back .qrs{display:flex;gap:12mm;margin-top:9mm;flex-wrap:nowrap}.back .qrb{display:flex;align-items:center;gap:4mm}.back .qrb svg{width:30mm;height:30mm;border-radius:2mm;flex:none}.back .qrb b{white-space:nowrap}.back .qrb span{font-size:11pt;line-height:1.35;opacity:.95}.back .qrb b{display:block;font-size:13pt;color:var(--cvh,#fff)}
.back .url{margin-top:9mm;display:inline-block;background:#FFC533;color:#221A00;font-weight:800;font-size:14pt;padding:4mm 7mm;border-radius:99mm;align-self:flex-start}
.back>*{position:relative}.back>.gridbg{position:absolute}
.p2{display:flex;flex-direction:column}.p2 .band{margin-top:auto;margin-bottom:6mm}.p2 .cols{font-size:11.500pt;gap:11mm;margin-top:10mm}.p2 h2{font-size:17pt}.p2 .brule{margin-bottom:9mm}.p2 .fit{font-size:8.500pt;padding:3mm 1.500mm}
